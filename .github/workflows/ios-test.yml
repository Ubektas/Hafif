name: iOS simülatör testi
on:
  workflow_dispatch:
  push:
    branches: [surum-2.0]
    paths: ['ios/**', 'www/**', 'tests/ios-demo.js', '.github/workflows/ios-test.yml']

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Test verisi (yalnızca bu derlemede)
        run: |
          cp tests/ios-demo.js ios/App/App/public/ios-demo.js
          python3 - <<'PY'
          p='ios/App/App/public/index.html'
          s=open(p,encoding='utf8').read()
          s=s.replace('<meta charset=utf8>','<meta charset=utf8><script src="ios-demo.js"></script>',1)
          open(p,'w',encoding='utf8').write(s)
          PY
      - name: CocoaPods
        run: cd ios/App && pod install
      - name: Simülatör için derle (imzasız)
        run: |
          cd ios/App
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" | tail -80
      - name: Simülatörde aç, ekran görüntüleri al
        run: |
          mkdir -p ios-sonuclari
          LINE=$(xcrun simctl list devices available | grep -E "iPhone 1[6-7] Pro Max \(" | head -1)
          [ -z "$LINE" ] && LINE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)?( Max)? \(" | head -1)
          DEV=$(echo "$LINE" | grep -oE '[0-9A-F-]{36}'); echo "$LINE" > ios-sonuclari/cihaz.txt; echo "Cihaz: $LINE"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$DEV" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" com.ugurbektas.hafif
          T0=$(date +%s)
          at() { while [ $(date +%s) -lt $((T0 + $1)) ]; do sleep 0.2; done; }
          at 12; xcrun simctl io "$DEV" screenshot ios-sonuclari/01-ozet.png
          k=0
          for n in gunluk kilo igneler adim ayarlar plus ekle koyu-ozet koyu-gunluk; do
            [ "$n" = "koyu-ozet" ] && { at $((17 + 6 * k - 4)); xcrun simctl ui "$DEV" appearance dark; }
            at $((17 + 6 * k)); xcrun simctl io "$DEV" screenshot "ios-sonuclari/$(printf %02d $((k + 2)))-$n.png"
            k=$((k + 1))
          done
          xcrun simctl spawn "$DEV" log show --last 4m --predicate 'process == "App"' --style compact 2>/dev/null | tail -200 > ios-sonuclari/log.txt || true
          echo "DEV=$DEV" >> "$GITHUB_ENV"
      - name: Widget boyut kontrolü (her widget, bütün iPhone boylarında)
        run: |
          xcrun simctl terminate "$DEV" com.ugurbektas.hafif || true
          xcrun simctl ui "$DEV" appearance light || true
          xcrun simctl launch "$DEV" com.ugurbektas.hafif -hafifWidgetTest
          C=$(xcrun simctl get_app_container "$DEV" com.ugurbektas.hafif data)
          for i in $(seq 1 120); do [ -f "$C/Documents/widget-test/BITTI" ] && break; sleep 1; done
          mkdir -p ios-sonuclari/widget-test
          cp -R "$C/Documents/widget-test/." ios-sonuclari/widget-test/ 2>/dev/null || true
          [ -f ios-sonuclari/widget-test/sonuc.json ] || { echo "::error::Widget boyut kontrolü sonuç üretmedi"; exit 1; }
          cat ios-sonuclari/widget-test/sonuc.json | head -60
          python3 -c "import json,sys;d=json.load(open('ios-sonuclari/widget-test/sonuc.json'));print('Widget çizimi:',d['toplam'],'· sorunlu:',d['hata']);sys.exit(1 if d['hata'] else 0)"
      - name: Sonuçları ios-sonuclari dalına kaydet
        if: always()
        run: |
          mkdir -p ios-sonuclari; cp xcodebuild.log ios-sonuclari/ 2>/dev/null || true
          grep -E "error:" xcodebuild.log | head -60 > ios-sonuclari/hatalar.txt 2>/dev/null || true
          cd ios-sonuclari
          git init -q -b ios-sonuclari
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "iOS testi ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-sonuclari
