name: Protein & Su tanı
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tests/besin-tani.js', '.github/workflows/tani.yml']
permissions:
  contents: write
jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mod: normal, gpu: swiftshader_indirect }
          - { mod: normal, gpu: swangle_indirect }
          - { mod: css-animasyon-yok, gpu: swiftshader_indirect }
          - { mod: bardak-gizli, gpu: swiftshader_indirect }
          - { mod: protein-gizli, gpu: swiftshader_indirect }
          - { mod: golge-yok, gpu: swiftshader_indirect }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm i --no-save playwright@1.56.1 && npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            TANI_MOD=${{ matrix.mod }} OUT=out node tests/besin-tani.js || true
      - if: always()
        run: |
          mkdir -p out && cd out && echo '${{ matrix.mod }} ${{ matrix.gpu }}' > ad.txt
          git init -q -b t && git -c user.name=a -c user.email=a@a add -A && git -c user.name=a -c user.email=a@a commit -q -m t
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" t:tani-${{ matrix.mod }}-${{ matrix.gpu }}
