name: Android emülatör testi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'tests/**', '.github/workflows/android-test.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i --no-save playwright@1.56.1
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
        env:
          HAFIF_TEST_MINIFY: '1'
      - name: KVM'yi aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde kur ve test et
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            OUT=test-sonuclari node tests/android-smoke.js
      - name: Sonuçları test-sonuclari dalına kaydet
        if: always()
        run: |
          cd test-sonuclari
          git init -q -b test-sonuclari
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Emülatör testi ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-sonuclari
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-sonuclari
          path: test-sonuclari
