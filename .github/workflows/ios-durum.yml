name: iOS TestFlight durumu
# App Store Connect'ten derlemelerin işlenme durumunu ve test gruplarını okur (Mac gerekmez).
# Başlatma: ios/DURUM dosyasına bir satır ekleyip surum-2.0'a gönder. Sonuç: ios-durum-sonuc dalında durum.txt
on:
  push:
    branches: [surum-2.0]
    paths: ['ios/DURUM']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  durum:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      IMZA_DEPO_TOKEN: ${{ secrets.IMZA_DEPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Durumu oku
        run: |
          python3 - "$RUNNER_TEMP/k.p8" <<'PY'
          import os,re,sys
          t=os.environ["ASC_KEY_P8"].replace("\\n","\n").replace("\r","").strip().strip('"').strip("'")
          m=re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----",t,re.S)
          body=re.sub(r"[^A-Za-z0-9+/=]","",m.group(1) if m else t)
          open(sys.argv[1],"w").write("-----BEGIN PRIVATE KEY-----\n"+"\n".join(body[i:i+64] for i in range(0,len(body),64))+"\n-----END PRIVATE KEY-----\n")
          PY
          pip -q install pyjwt cryptography requests
          KEY_PATH="$RUNNER_TEMP/k.p8" python3 araclar/ios-imza.py durum sonuc || true
          rm -f "$RUNNER_TEMP/k.p8"
      - name: hafif-imza deposu erişimi
        run: |
          mkdir -p sonuc
          { [ -n "$IMZA_DEPO_TOKEN" ] && echo "IMZA_DEPO_TOKEN: tanımlı" || echo "IMZA_DEPO_TOKEN: YOK"
            if git ls-remote "https://x-access-token:${IMZA_DEPO_TOKEN}@github.com/Ubektas/hafif-imza.git" >/dev/null 2>e.txt; then echo "hafif-imza okuma: tamam"; else echo "hafif-imza okuma: HATA $(grep -vE 'x-access-token|github_pat_' e.txt | tr '\n' ' ')"; fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${IMZA_DEPO_TOKEN}" https://api.github.com/repos/Ubektas/hafif-imza)
            echo "API depo erişimi: $code"
            curl -s -H "Authorization: Bearer ${IMZA_DEPO_TOKEN}" https://api.github.com/repos/Ubektas/hafif-imza | python3 -c "import json,sys;d=json.load(sys.stdin);print('izinler:',d.get('permissions'),'· gizli:',d.get('private'))" 2>/dev/null || true
          } | tee sonuc/token.txt
      - name: ios-durum-sonuc dalına kaydet
        run: |
          cat sonuc/token.txt >> sonuc/durum.txt 2>/dev/null; mkdir -p sonuc; date -u +"%Y-%m-%d %H:%M UTC" >> sonuc/durum.txt
          cd sonuc && git init -q -b ios-durum-sonuc
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "iOS durum"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-durum-sonuc
