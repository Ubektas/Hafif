name: iOS derlemesi
# macOS'ta Xcode ile derler.
# - Apple imzalama gizli değişkenleri varsa: imzalı IPA üretir; "yayinla" açıksa GitHub Releases'a koyar,
#   App Store Connect API anahtarı da varsa TestFlight'a yükler.
# - Yoksa: imzasız derleme yapar (yalnızca kodun iPhone için derlendiğini doğrular, telefona kurulamaz).
#
# Gizli değişkenler (Settings → Secrets and variables → Actions):
#   IOS_DIST_CERT_P12_B64     Apple Distribution sertifikası (.p12), base64
#   IOS_DIST_CERT_PASSWORD    .p12 parolası
#   IOS_PROFILE_B64           com.ugurbektas.hafif için App Store provisioning profili (HealthKit açık), base64
#   APPLE_TEAM_ID             10 karakterlik ekip kimliği
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64   (isteğe bağlı) TestFlight'a otomatik yükleme için API anahtarı
on:
  push:
    branches: [main]
    paths: ['ios/**', 'www/**', 'package.json', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      surum:
        description: 'Sürüm adı (ör. 2.0.4)'
        required: true
        default: '1.0.0'
  workflow_call:
    inputs:
      surum:
        type: string
        required: true
      yayinla:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: En yeni Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Sürüm numarası
        run: |
          AD="${{ inputs.surum }}"
          AD="${AD#v}"; [ -z "$AD" ] && AD="0.0.0"
          echo "SURUM=$AD" >> "$GITHUB_ENV"
          echo "YAPI=${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx cap sync ios
      - name: İmzalama var mı?
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          PROF: ${{ secrets.IOS_PROFILE_B64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROF" ] && [ -n "$TEAM" ]; then echo "IMZA=1" >> "$GITHUB_ENV"
          else echo "IMZA=0" >> "$GITHUB_ENV"; echo "::warning::Apple imzalama gizli değişkenleri yok; imzasız derleme yapılıyor (IPA üretilmez)."; fi

      - name: İmzasız derleme (doğrulama)
        if: env.IMZA == '0'
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$SURUM" CURRENT_PROJECT_VERSION="$YAPI" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee derleme.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" derleme.log || { grep -E "error:" derleme.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          mkdir -p ../../cikti && (cd build/Build/Products/Release-iphoneos && zip -qr "../../../../../../cikti/hafif-$SURUM-imzasiz.zip" App.app)

      - name: Anahtarlığı ve profili kur
        if: env.IMZA == '1'
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          P12_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROF: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KC="$RUNNER_TEMP/hafif.keychain-db"; KPW=$(uuidgen)
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KC" >/dev/null
          security list-keychain -d user -s "$KC"
          echo "$PROF" | base64 -d > "$RUNNER_TEMP/hafif.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/hafif.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/hafif.mobileprovision" | plutil -extract Name raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/hafif.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFIL_ADI=$NAME" >> "$GITHUB_ENV"

      - name: İmzalı IPA
        if: env.IMZA == '1'
        working-directory: ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Hafif.xcarchive \
            MARKETING_VERSION="$SURUM" CURRENT_PROJECT_VERSION="$YAPI" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIL_ADI" \
            archive 2>&1 | tee derleme.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" derleme.log || { grep -E "error:" derleme.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.ugurbektas.hafif</key><string>$PROFIL_ADI</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Hafif.xcarchive -exportPath build/ipa -exportOptionsPlist build/ExportOptions.plist
          mkdir -p ../../cikti && cp build/ipa/*.ipa "../../cikti/hafif-$SURUM.ipa"

      - name: TestFlight'a yükle
        if: env.IMZA == '1' && inputs.yayinla
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          if [ -z "$KID" ] || [ -z "$ISS" ] || [ -z "$P8" ]; then echo "::notice::App Store Connect API anahtarı yok; IPA'yı Transporter ile elle yükle."; exit 0; fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KID.p8
          xcrun altool --upload-app -t ios -f "cikti/hafif-$SURUM.ipa" --apiKey "$KID" --apiIssuer "$ISS"

      - name: GitHub Releases'a ekle
        if: env.IMZA == '1' && inputs.yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$SURUM" "cikti/hafif-$SURUM.ipa" --clobber

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hafif-ios-${{ env.SURUM }}
          path: |
            cikti
            ios/App/derleme.log
          if-no-files-found: ignore
