name: iOS TestFlight
# İmzalı iOS derlemesi üretip App Store Connect'e (TestFlight) yükler.
# Başlatma: "ios-v2.0.2" gibi bir etiket gönder (git tag ios-v2.0.2-1 && git push origin ios-v2.0.2-1)
# ya da (iş akışı main'e alınınca) Actions sekmesinden elle.
# Gereken GitHub secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (.p8 dosyasının tüm metni), APPLE_TEAM_ID
# İmzalama otomatik: Xcode, API anahtarıyla (Admin rolü) dağıtım sertifikasını ve profili kendisi oluşturur.
on:
  push:
    tags: ['ios-v*']
    # etiket gönderilemeyen ortamlar için: bu dosya değişince (ör. içine yeni bir satır) derleme başlar
    branches: [surum-2.0]
    paths: ['ios/TESTFLIGHT']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - name: Gizli değerler tanımlı mı
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do [ -n "${!v}" ] || { echo "::error::$v secret'ı eksik"; exit 1; }; done
          [ -n "$ASC_KEY_P8" ] || { echo "::error::ASC_KEY_P8 secret'ı eksik"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: CocoaPods
        run: cd ios/App && pod install
      - name: API anahtarı
        shell: bash
        run: |
          exec > >(tee anahtar.txt) 2>&1
          mkdir -p "$RUNNER_TEMP/keys"
          # yapıştırırken bozulmuş olabilir (tek satır, \r, boşluk, tırnak): gövdeyi ayıklayıp 64'lük satırlarla yeniden yaz
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import os,re,sys
          t=os.environ["ASC_KEY_P8"].replace("\\n","\n").replace("\r","").strip().strip('"').strip("'")
          m=re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----",t,re.S)
          body=re.sub(r"[^A-Za-z0-9+/=]","",m.group(1) if m else t)
          print("Anahtar biçimi: BEGIN/END",bool(m),"· gövde uzunluğu",len(body),"(ES256 anahtarında genelde 200)")
          open(sys.argv[1],"w").write("-----BEGIN PRIVATE KEY-----\n"+"\n".join(body[i:i+64] for i in range(0,len(body),64))+"\n-----END PRIVATE KEY-----\n")
          PY
          echo "Key ID uzunluğu: ${#ASC_KEY_ID} · Issuer ID uzunluğu: ${#ASC_ISSUER_ID} · Team ID uzunluğu: ${#APPLE_TEAM_ID}"
          openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -noout && echo "Anahtar okunabiliyor ✓" || echo "::error::.p8 anahtarı okunamıyor; ASC_KEY_P8 secret'ını yeniden yapıştır"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Arşivle (imzalı)
        run: |
          cd ios/App
          set -o pipefail
          # derleme numarası her yüklemede artmalı: çalışma numarası
          BUILD=$((GITHUB_RUN_NUMBER + 1))
          echo "Derleme numarası: $BUILD"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hafif.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive 2>&1 | tee ../../xcodebuild-archive.log | grep -E "error:|BUILD|ARCHIVE" | tail -60
      - name: TestFlight'a yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Hafif.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee xcodebuild-export.log | grep -E "error|Upload|EXPORT|succeeded|failed" | tail -60
      - name: Günlükleri ios-testflight-sonuc dalına kaydet
        if: always()
        run: |
          mkdir -p sonuc
          for f in xcodebuild-archive.log xcodebuild-export.log; do [ -f "$f" ] && grep -vE "authenticationKey|AuthKey_" "$f" > "sonuc/$f" || true; done
          grep -hE "error:|error |failed|Upload succeeded|EXPORT SUCCEEDED|ARCHIVE SUCCEEDED" sonuc/*.log 2>/dev/null | head -80 > sonuc/ozet.txt || true
          [ -f anahtar.txt ] && cat anahtar.txt >> sonuc/ozet.txt || true
          echo "${GITHUB_SHA::7} · çalışma $GITHUB_RUN_NUMBER · derleme $((GITHUB_RUN_NUMBER + 1))" >> sonuc/ozet.txt
          rm -rf "$RUNNER_TEMP/keys"
          cd sonuc
          git init -q -b ios-testflight-sonuc
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "TestFlight ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-testflight-sonuc
