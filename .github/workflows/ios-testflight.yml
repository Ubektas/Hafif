name: iOS TestFlight
# İmzalı iOS derlemesi üretip App Store Connect'e (TestFlight) yükler.
# Başlatma: "ios-v2.0.2" gibi bir etiket gönder (git tag ios-v2.0.2-1 && git push origin ios-v2.0.2-1)
# ya da (iş akışı main'e alınınca) Actions sekmesinden elle.
# Gereken GitHub secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (.p8 dosyasının tüm metni), APPLE_TEAM_ID,
# IMZA_DEPO_TOKEN (yalnızca Ubektas/hafif-imza deposuna Contents yazma izni olan token)
# İmzalama: araclar/ios-imza.py API anahtarıyla (Admin rolü) bir kez Apple Distribution sertifikası oluşturur,
# anahtarını şifreleyip gizli Ubektas/hafif-imza deposunda saklar (IMZA_DEPO_TOKEN) ve sonraki derlemelerde kullanır; 'Hafif App Store' profili yeniden kullanılır.
on:
  push:
    tags: ['ios-v*']
    # etiket gönderilemeyen ortamlar için: bu dosya değişince (ör. içine yeni bir satır) derleme başlar
    branches: [surum-2.0]
    paths: ['ios/TESTFLIGHT']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testflight:
    # App Store, iOS 26 SDK (Xcode 26) ile derlenmiş uygulama istiyor (ITMS-90725)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      IMZA_DEPO_TOKEN: ${{ secrets.IMZA_DEPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Gizli değerler tanımlı mı
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do [ -n "${!v}" ] || { echo "::error::$v secret'ı eksik"; exit 1; }; done
          [ -n "$ASC_KEY_P8" ] || { echo "::error::ASC_KEY_P8 secret'ı eksik"; exit 1; }
      - name: Xcode 26 seç
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode.app)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version | tee xcode-surum.txt
          xcodebuild -version | grep -qE "Xcode (2[6-9]|[3-9][0-9])" || { echo "::error::Xcode 26 veya üstü bulunamadı"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: CocoaPods
        run: cd ios/App && pod install
      - name: API anahtarı
        shell: bash
        run: |
          exec > >(tee anahtar.txt) 2>&1
          mkdir -p "$RUNNER_TEMP/keys"
          # yapıştırırken bozulmuş olabilir (tek satır, \r, boşluk, tırnak): gövdeyi ayıklayıp 64'lük satırlarla yeniden yaz
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import os,re,sys
          t=os.environ["ASC_KEY_P8"].replace("\\n","\n").replace("\r","").strip().strip('"').strip("'")
          m=re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----",t,re.S)
          body=re.sub(r"[^A-Za-z0-9+/=]","",m.group(1) if m else t)
          print("Anahtar biçimi: BEGIN/END",bool(m),"· gövde uzunluğu",len(body),"(ES256 anahtarında genelde 200)")
          open(sys.argv[1],"w").write("-----BEGIN PRIVATE KEY-----\n"+"\n".join(body[i:i+64] for i in range(0,len(body),64))+"\n-----END PRIVATE KEY-----\n")
          PY
          echo "Key ID uzunluğu: ${#ASC_KEY_ID} · Issuer ID uzunluğu: ${#ASC_ISSUER_ID} · Team ID uzunluğu: ${#APPLE_TEAM_ID}"
          openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" -noout && echo "Anahtar okunabiliyor ✓" || echo "::error::.p8 anahtarı okunamıyor; ASC_KEY_P8 secret'ını yeniden yapıştır"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: App Store imzası (kalıcı sertifika + profil)
        shell: bash
        run: |
          exec > >(tee -a anahtar.txt) 2>&1
          python3 -m venv "$RUNNER_TEMP/v" && "$RUNNER_TEMP/v/bin/pip" -q install pyjwt cryptography requests
          # kalıcı dağıtım sertifikası: gizli Ubektas/hafif-imza deposunda, ayrıca şifreli (parola API anahtarından türetilir)
          [ -n "$IMZA_DEPO_TOKEN" ] || { echo "::error::IMZA_DEPO_TOKEN secret'ı eksik (hafif-imza deposuna yazma izni olan token)"; exit 1; }
          export IMZA_PAROLA=$(shasum -a 256 "$KEY_PATH" | cut -d' ' -f1)
          export KALICI="$RUNNER_TEMP/kalici"
          git clone -q --depth=1 "https://x-access-token:${IMZA_DEPO_TOKEN}@github.com/Ubektas/hafif-imza.git" "$KALICI" || { echo "::error::hafif-imza deposu açılamadı (depo var mı, token doğru mu?)"; exit 1; }
          BUNDLE=com.ugurbektas.hafif "$RUNNER_TEMP/v/bin/python" araclar/ios-imza.py hazirla "$RUNNER_TEMP/imza"
          if [ -f "$KALICI/YENI" ]; then
            rm "$KALICI/YENI"
            cd "$KALICI"
            git -c user.name="github-actions" -c user.email="actions@github.com" add dagitim.enc dagitim.json
            git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "iOS dağıtım sertifikası (şifreli)"
            git push -q origin HEAD && echo "Sertifika hafif-imza deposuna kaydedildi"
            cd "$GITHUB_WORKSPACE"
          fi
          rm -rf "$KALICI/.git"
          I="$RUNNER_TEMP/imza"
          /usr/bin/openssl x509 -inform DER -in "$I/cert.cer" -out "$I/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$I/key.pem" -in "$I/cert.pem" -out "$I/imza.p12" -passout pass:hafif
          KC="$RUNNER_TEMP/hafif.keychain-db"
          security create-keychain -p hafif "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p hafif "$KC"
          security import "$I/imza.p12" -k "$KC" -P hafif -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k hafif "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          UUID=$(python3 -c "import json;print(json.load(open('$I/ids.json'))['uuid'])")
          NAME=$(python3 -c "import json;print(json.load(open('$I/ids.json'))['name'])")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do mkdir -p "$d"; cp "$I/profile.mobileprovision" "$d/$UUID.mobileprovision"; done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          # yalnızca App hedefi elle imzalanır (Pods hedeflerine dokunulmaz)
          python3 - "$NAME" "$APPLE_TEAM_ID" <<'PY'
          import sys
          p='ios/App/App.xcodeproj/project.pbxproj'; s=open(p).read(); name,team=sys.argv[1],sys.argv[2]
          blocks=s.split('buildSettings = {')
          for i,b in enumerate(blocks):
              if 'PRODUCT_BUNDLE_IDENTIFIER = com.ugurbektas.hafif;' in b.split('};')[0]:
                  blocks[i]=b.replace('CODE_SIGN_STYLE = Automatic;',f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{name}";',1)
          open(p,'w').write('buildSettings = {'.join(blocks)); print('App hedefi elle imzaya ayarlandı')
          PY
      - name: Arşivle (imzalı)
        run: |
          cd ios/App
          set -o pipefail
          # derleme numarası her yüklemede artmalı: çalışma numarası
          BUILD=$((GITHUB_RUN_NUMBER + 1))
          echo "Derleme numarası: $BUILD"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hafif.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            archive 2>&1 | tee ../../xcodebuild-archive.log | grep -E "error:|BUILD|ARCHIVE" | tail -60
      - name: IPA üret
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.ugurbektas.hafif</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Hafif.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            2>&1 | tee xcodebuild-export.log | grep -E "error|EXPORT|succeeded|failed" | tail -40
          ls -la "$RUNNER_TEMP/out"
      - name: TestFlight'a yükle
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP"/out/*.ipa | head -1)
          set -o pipefail
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee xcodebuild-upload.log | tail -30
      - name: Anahtarlığı temizle
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/v" ] && "$RUNNER_TEMP/v/bin/python" araclar/ios-imza.py temizle "$RUNNER_TEMP/imza" 2>&1 | tee -a anahtar.txt || true
          security delete-keychain "$RUNNER_TEMP/hafif.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/imza"
      - name: Günlükleri ios-testflight-sonuc dalına kaydet
        if: always()
        run: |
          mkdir -p sonuc
          for f in xcodebuild-archive.log xcodebuild-export.log xcodebuild-upload.log; do [ -f "$f" ] && grep -vE "authenticationKey|AuthKey_" "$f" > "sonuc/$f" || true; done
          grep -hE "error:|error |ERROR|failed|Upload succeeded|UPLOAD SUCCEEDED|No errors uploading|Delivery UUID|EXPORT SUCCEEDED|ARCHIVE SUCCEEDED" sonuc/*.log 2>/dev/null | head -80 > sonuc/ozet.txt || true
          [ -f xcode-surum.txt ] && cat xcode-surum.txt >> sonuc/ozet.txt || true
          [ -f anahtar.txt ] && grep -vE "x-access-token|github_pat_|PRIVATE KEY" anahtar.txt >> sonuc/ozet.txt || true
          echo "${GITHUB_SHA::7} · çalışma $GITHUB_RUN_NUMBER · derleme $((GITHUB_RUN_NUMBER + 1))" >> sonuc/ozet.txt
          rm -rf "$RUNNER_TEMP/keys"
          cd sonuc
          git init -q -b ios-testflight-sonuc
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "TestFlight ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-testflight-sonuc
