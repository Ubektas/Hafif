<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../www/fonts/fonts.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,sans-serif;background:#DCE6E1;width:760px}
.sheet{padding:28px 30px;display:flex;flex-direction:column;gap:22px;background:radial-gradient(80% 40% at 90% 0%,#F3C9A8 0%,transparent 60%),radial-gradient(80% 50% at 0% 100%,#9BC7D9 0%,transparent 60%),linear-gradient(170deg,#E8D9CC,#B9CFD6)}
.hd{font:700 30px "Bricolage Grotesque";letter-spacing:-.02em;color:#0B3B33}.hd small{display:block;font:500 15px Figtree;color:#3D524C;letter-spacing:0;margin-top:4px}
.row{display:flex;flex-direction:column;gap:8px}
.nm{font:700 15px Figtree;color:#0B2420;display:flex;align-items:center;gap:8px}.nm i{font-style:normal;background:#0B3B33;color:#9FF0D6;border-radius:99px;padding:2px 9px;font-size:12px}
.pair{display:flex;gap:16px;align-items:flex-start}
.w{border-radius:26px;box-shadow:0 16px 34px -18px rgba(0,0,0,.45);overflow:hidden;position:relative;flex:none}
.s{width:172px;height:172px}.l{width:362px;height:172px}.s1{width:172px;height:80px}.l1{width:362px;height:80px}
.dk{background:radial-gradient(120% 120% at 100% 0%,#1F8A70 0%,transparent 55%),linear-gradient(160deg,#0B3B33,#062520);color:#fff}
.lt{background:rgba(255,255,255,.94);color:#0B2420}
.p{padding:14px 16px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:5px;font:700 11px Figtree;opacity:.75}
.ey{font:700 9.5px Figtree;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.big{font:700 30px/1 "Bricolage Grotesque";letter-spacing:-.03em}
.mid{font:700 18px/1.1 "Bricolage Grotesque";letter-spacing:-.01em}
.sm{font-size:11.5px;opacity:.75}
.mint{color:#9FF0D6}.acc{color:#0E7C66}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}.lt .bar{background:#EDF3F0}.bar i{display:block;height:100%;border-radius:9px}
.btn{flex:1;text-align:center;border-radius:12px;padding:7px 0;font:700 12px Figtree}
.chip{display:inline-block;border-radius:99px;padding:3px 8px;font:600 10.5px Figtree;background:rgba(255,255,255,.12)}
.lt .chip{background:#EDF3F0}
.lockw{filter:blur(4px);opacity:.6}
</style></head><body><div class="sheet" id="root"></div>
<script>
const leaf='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 21V12a8 8 0 0 1 8-8h6v6a8 8 0 0 1-8 8H7"/><path d="M9 15l6-6"/></svg>';
const L=(t='Hafif')=>`<div class="logo">${leaf}${t}</div>`;
const ring=(f,sz,st,c1,c2,inner)=>{const r=(sz-st)/2,C=2*Math.PI*r;return `<div style="position:relative;width:${sz}px;height:${sz}px;flex:none"><svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${c2}" stroke-width="${st}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${c1}" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 ${sz/2} ${sz/2})"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">${inner}</div></div>`};
const R=(f,sz,st,c,inner,dk=true)=>ring(f,sz,st,c,dk?'rgba(255,255,255,.12)':'#EDF3F0',inner);
const bar=(f,c)=>`<div class="bar"><i style="width:${f*100}%;background:${c}"></i></div>`;
const W=[90.9,90.6,90.3,90.3,89.8,89.4,89.5,89.1,88.9,88.6];
const spark=(w,h,col,fill,shots)=>{const mn=Math.min(...W)-.3,mx=Math.max(...W)+.3,x=i=>i/(W.length-1)*w,y=v=>4+(mx-v)/(mx-mn)*(h-8);const d=W.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${shots?[1,4,7].map(i=>`<line x1="${x(i)}" x2="${x(i)}" y1="0" y2="${h}" stroke="#E2643D" stroke-opacity=".5" stroke-dasharray="3 3"/>`).join(''):''}<path d="${d}L${w} ${h}L0 ${h}Z" fill="${col}" opacity="${fill}"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`};
const blocks=(n,of,cols,sz)=>{const c=['#F2C14E','#F2C14E','#E3D7B4','#D98A3D','#D98A3D','#D98A3D','#D98A3D','#D98A3D','#D98A3D','#7DB7E0','#7DB7E0','#7DB7E0','#E6B35A','#E6B35A','#E6B35A'];return `<div style="display:grid;grid-template-columns:repeat(${cols},${sz}px);gap:3px">${Array.from({length:of},(_,i)=>`<i style="width:${sz}px;height:${sz}px;border-radius:4px;background:${i<n?c[i%c.length]:'rgba(255,255,255,.12)'}"></i>`).join('')}</div>`};
const glass=(f,h)=>`<svg width="${h*.62}" height="${h}" viewBox="0 0 62 100"><path d="M4 4h54l-6 90a5 5 0 0 1-5 4H15a5 5 0 0 1-5-4z" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.4)" stroke-width="2"/><clipPath id="gc${h}"><path d="M4 4h54l-6 90a5 5 0 0 1-5 4H15a5 5 0 0 1-5-4z"/></clipPath><rect clip-path="url(#gc${h})" x="0" y="${4+94*(1-f)}" width="62" height="100" fill="#5BC0F5"/><path clip-path="url(#gc${h})" d="M0 ${4+94*(1-f)} q15 -5 31 0 t31 0" fill="#8FD6F8"/></svg>`;

const ITEMS=[
 ['Döngü','İğne kullananlar',
  `<div class="w s dk"><div class="p" style="align-items:center;gap:6px">${L()}${R(4/7,104,10,'#9FF0D6',`<span class="ey" style="font-size:8.5px">yeni iğne</span><span class="big" style="font-size:24px">3 gün</span>`)}<div><b class="mid" style="font-size:15px">Zirve</b><span class="sm"> · 5,0 mg</span></div></div></div>`,
  `<div class="w l dk"><div class="p" style="flex-direction:row;gap:14px;align-items:center">${R(4/7,124,11,'#9FF0D6',`<span class="ey" style="font-size:8.5px">vücutta</span><span class="big" style="font-size:26px">5,0</span><span class="sm">mg · yüksek</span>`)}<div style="display:flex;flex-direction:column;gap:6px;min-width:0">${L()}<span class="mid">Zirve · 4/7</span><span class="sm" style="line-height:1.35">Etkinin en güçlü olduğu günler. Proteini kolay kaynaklardan tamamla.</span><span class="chip">Yeni iğne · Paz 09:00</span></div></div></div>`],
 ['Sıradaki iğne','İğne kullananlar',
  `<div class="w s1 dk"><div class="p" style="flex-direction:row;align-items:center;gap:10px"><span style="width:40px;height:40px;border-radius:12px;background:rgba(226,100,61,.25);display:grid;place-items:center;color:#F4A586;font-size:18px">💉</span><div><span class="ey">yeni iğne</span><div class="mid">3 gün</div><span class="sm">Paz 09:00</span></div></div></div>`,
  `<div class="w l dk"><div class="p" style="gap:10px"><div style="display:flex;justify-content:space-between">${L()}<span class="sm">Pazar · 09:00</span></div><div style="display:flex;gap:18px;align-items:flex-end"><div><span class="ey">yeni iğne</span><div class="big">3 gün</div></div><div style="display:flex;flex-direction:column;gap:4px;font-size:12.5px"><span>💊 <b>5 mg</b> · Mounjaro</span><span>📍 Önerilen: <b>Uyluk sol</b></span><span>🖊️ Kalemde <b style="color:#F4A586">2 doz</b> kaldı</span></div></div><div style="display:flex;gap:8px;margin-top:auto"><div class="btn" style="background:rgba(226,100,61,.3);color:#FFD2C2">İğneyi kaydet</div></div></div></div>`],
 ['Bugün','Su, protein ve adım bir arada',
  `<div class="w s dk"><div class="p" style="gap:8px">${L('Bugün')}<div style="display:flex;justify-content:space-between;margin-top:auto">${[[.7,'#5BC0F5','💧'],[.67,'#E6B35A','🥚'],[.83,'#8C9BF0','👣']].map(([f,c,e])=>R(f,46,6,c,`<span style="font-size:15px">${e}</span>`)).join('')}</div><div style="display:flex;justify-content:space-between;font:700 11px Figtree;margin-top:2px"><span>1,75 L</span><span>74 g</span><span>6.240</span></div></div></div>`,
  `<div class="w l dk"><div class="p" style="gap:8px"><div style="display:flex;justify-content:space-between">${L()}<span class="sm">Cuma 23 Ekim</span></div>${[['💧 Su','1.750 / 2.500 ml',.7,'#5BC0F5'],['🥚 Protein','74 / 110 g',.67,'#E6B35A'],['👣 Adım','6.240 / 7.500',.83,'#8C9BF0']].map(([a,b,f,c])=>`<div><div style="display:flex;justify-content:space-between;font-size:11.5px"><span>${a}</span><b>${b}</b></div><div style="margin-top:3px">${bar(f,c)}</div></div>`).join('')}<div style="display:flex;gap:8px;margin-top:auto"><div class="btn" style="background:rgba(91,192,245,.2);color:#BFE6FB">+250 ml su</div><div class="btn" style="background:rgba(159,240,214,.16);color:#9FF0D6">Kilo gir</div></div></div></div>`],
 ['Kilo','Açık renk',
  `<div class="w s1 lt"><div class="p" style="justify-content:center"><span class="ey acc" style="opacity:1">güncel</span><div class="big" style="font-size:26px;color:#0B3B33">88,6<small style="font:500 12px Figtree;color:#5F726C"> kg</small></div><span style="font:700 11px Figtree" class="acc">−7,1 kg</span></div></div>`,
  `<div class="w l1 lt"><div class="p" style="flex-direction:row;align-items:center;gap:12px"><div><span class="ey acc" style="opacity:1">Hafif · bugün</span><div class="big" style="font-size:26px;color:#0B3B33">88,6<small style="font:500 12px Figtree;color:#5F726C"> kg</small></div><span style="font:700 11px Figtree" class="acc">−7,1 kg · hedefe %40</span></div>${spark(150,50,'#0E7C66',.12)}<span style="width:34px;height:34px;border-radius:50%;background:#0B3B33;color:#9FF0D6;display:grid;place-items:center;font:700 20px Figtree;flex:none">+</span></div></div>`],
 ['Kilo grafiği','Açık renk',
  `<div class="w s lt"><div class="p" style="gap:6px"><span class="ey acc" style="opacity:1">son 30 gün</span><div class="mid" style="color:#0B3B33">−2,3 kg</div><div style="margin-top:auto">${spark(140,84,'#0E7C66',.12)}</div></div></div>`,
  `<div class="w l lt"><div class="p" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="ey acc" style="opacity:1">Kilo · son 30 gün</span><span style="font:700 12px Figtree;color:#0E7C66">haftada −0,6 kg</span></div><div style="display:flex;align-items:baseline;gap:8px"><span class="big" style="color:#0B3B33;font-size:24px">88,6</span><span style="font-size:12px;color:#5F726C">90,9 → 88,6 kg</span></div><div style="margin-top:auto">${spark(330,78,'#0E7C66',.12,true)}</div><span style="font-size:10px;color:#5F726C">kesikli çizgiler iğne günleri</span></div></div>`],
 ['Hedefe ilerleme','Rozetlerle',
  `<div class="w s dk"><div class="p" style="align-items:center;gap:6px">${L('Hedef')}${R(.4,104,10,'#9FF0D6',`<span class="big" style="font-size:28px">%40</span><span class="sm">78 kg hedef</span>`)}<span class="sm"><b class="mint">10,6 kg</b> kaldı</span></div></div>`,
  `<div class="w l dk"><div class="p" style="flex-direction:row;gap:16px;align-items:center">${R(.4,118,11,'#9FF0D6',`<span class="big" style="font-size:30px">%40</span><span class="sm">hedefe</span>`)}<div style="display:flex;flex-direction:column;gap:7px">${L()}<div><span class="ey">kalan</span><div class="mid">10,6 kg</div></div><div style="display:flex;align-items:center;gap:8px;background:rgba(201,160,74,.18);border-radius:14px;padding:7px 10px"><span style="font-size:20px">🏅</span><div><span class="ey" style="color:#E8C877;opacity:1">sıradaki rozet</span><div style="font:700 13px Figtree">%10 · 2,5 kg kaldı</div></div></div></div></div></div>`],
 ['Su','Tek dokunuşla ekle',
  `<div class="w s dk"><div class="p" style="flex-direction:row;gap:10px;align-items:center">${glass(.7,110)}<div style="display:flex;flex-direction:column;gap:6px"><span class="ey">su</span><span class="mid">1.750</span><span class="sm">/ 2.500 ml</span><div class="btn" style="background:rgba(91,192,245,.25);color:#BFE6FB;padding:6px 10px">+250</div></div></div></div>`,
  `<div class="w l dk"><div class="p" style="flex-direction:row;gap:16px;align-items:center">${glass(.7,124)}<div style="flex:1;display:flex;flex-direction:column;gap:8px">${L()}<div><span class="big">1.750</span><span class="sm"> / 2.500 ml</span></div>${bar(.7,'#5BC0F5')}<div style="display:flex;gap:8px"><div class="btn" style="background:rgba(91,192,245,.25);color:#BFE6FB">+250 ml</div><div class="btn" style="background:rgba(91,192,245,.25);color:#BFE6FB">+500 ml</div></div></div></div></div>`],
 ['Protein','Bloklarla',
  `<div class="w s dk"><div class="p" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="ey">protein</span><span class="sm">%67</span></div><div><span class="big" style="font-size:26px">74</span><span class="sm"> / 110 g</span></div><div style="margin-top:auto">${blocks(15,22,8,14)}</div></div></div>`,
  `<div class="w l dk"><div class="p" style="gap:8px"><div style="display:flex;justify-content:space-between">${L()}<span class="sm">36 g kaldı</span></div><div style="display:flex;gap:14px;align-items:center"><div><span class="big">74</span><span class="sm"> / 110 g</span></div>${blocks(15,22,11,15)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:auto"><span class="chip">🥚 Yumurta ×2</span><span class="chip">🍗 Tavuk 31 g</span><span class="chip">🥛 Yoğurt 15 g</span><span class="chip" style="background:rgba(230,179,90,.25);color:#F3D29A">+ Ekle</span></div></div></div>`],
 ['Adım','Health Connect',
  `<div class="w s dk"><div class="p" style="align-items:center;gap:6px">${L('Adım')}${R(.83,104,10,'#8C9BF0',`<span class="big" style="font-size:24px">6.240</span><span class="sm">/ 7.500</span>`)}<span class="sm">4,1 km · 58 dk</span></div></div>`,
  `<div class="w l dk"><div class="p" style="flex-direction:row;gap:14px;align-items:center">${R(.83,112,10,'#8C9BF0',`<span class="big" style="font-size:24px">6.240</span><span class="sm">adım</span>`)}<div style="flex:1;display:flex;flex-direction:column;gap:6px">${L()}<span class="sm">1.260 adım kaldı · 4,1 km</span><div style="display:flex;align-items:flex-end;gap:3px;height:52px">${[0,0,0,0,0,0,0,8,30,15,7,5,22,10,5,6,2,0,0,0,0,0,0,0].map(v=>`<i style="flex:1;height:${Math.max(3,v/30*52)}px;border-radius:3px;background:${v>18?'#8C9BF0':'rgba(140,155,240,.4)'}"></i>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:9.5px;opacity:.6"><span>00</span><span>12</span><span>24</span></div></div></div></div>`],
 ['Takviyeler','Vakit vakit',
  `<div class="w s dk"><div class="p" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:center">${L('Takviye')}<span class="chip">2/4</span></div><span class="ey" style="margin-top:6px">sıradaki · 19:00</span><span class="mid">Akşam</span><span class="sm">Omega-3 · B12</span><div class="btn" style="background:rgba(123,91,208,.3);color:#D6CBF7;margin-top:auto;flex:none">Hepsini aldım</div></div></div>`,
  `<div class="w l dk"><div class="p" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:center">${L()}<span class="chip">Bugün 2/4</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['☀️ Sabah · 07:30','Magnezyum · D3',1],['🌙 Akşam · 19:00','Omega-3 · B12',0]].map(([a,b,ok])=>`<div style="background:rgba(255,255,255,.07);border-radius:14px;padding:8px 10px"><div style="font:700 11.5px Figtree">${a}</div><div class="sm" style="margin:2px 0 6px">${b}</div>${ok?'<span style="font:700 11px Figtree;color:#9FF0D6">✓ alındı</span>':'<span style="font:700 11px Figtree;color:#D6CBF7">bekliyor</span>'}</div>`).join('')}</div><div class="btn" style="background:rgba(123,91,208,.3);color:#D6CBF7;margin-top:auto;flex:none">Akşam takviyelerini aldım</div></div></div>`]
];
const lockDemo=`<div class="row"><div class="nm">Plus olmayan kullanıcıda</div><div class="pair"><div class="w s dk"><div class="lockw p" style="align-items:center;gap:6px">${R(4/7,104,10,'#9FF0D6',`<span class="big" style="font-size:24px">3 gün</span>`)}<b>Zirve</b></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px"><span style="font:700 12px Figtree;letter-spacing:.1em;color:#9FF0D6">✦ HAFİF PLUS</span><span style="font-size:12px;opacity:.85">Widget'lar Plus'ta</span><span class="btn" style="background:#9FF0D6;color:#0B3B33;flex:none;padding:6px 12px">Aç</span></div></div></div></div>`;
const part=new URLSearchParams(location.search).get('k')||'1';
const list=part==='1'?ITEMS.slice(0,5):ITEMS.slice(5);
root.innerHTML=`<div class="hd">Hafif widget'ları · ${part==='1'?'1–5':'6–10'}<small>Solda küçük, sağda büyük boyut. Kullanıcı widget'ı büyütüp küçültünce görünüm kendiliğinden değişir.</small></div>`+
 list.map(([n,t,a,b],i)=>`<div class="row"><div class="nm"><i>${(part==='1'?1:6)+i}</i>${n}<span style="font-weight:500;color:#3D524C;font-size:13px">· ${t}</span></div><div class="pair">${a}${b}</div></div>`).join('')+(part==='2'?lockDemo:'');
</script></body></html>
