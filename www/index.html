}
:root[data-hf="dark"]{
  --bg:#08171A; --glow:#0E2D27; --surface:#10221F; --surface-2:#132824; --sunk:#0B1C19; --fg:#E4F1EC; --muted:#8FA8A1; --line:#1D3631;
  --accent:#43C9A0; --accent-soft:#103A30; --accent-ink:#04201A; --fat:#A493DD; --fat-soft:#241F38; --shot:#5571C2; --shot-soft:#172038; --protein-ink:#F0C27A; --mint:#9FF0D6;
  --emerald-1:#167A64; --emerald-2:#0C4A3F; --head:#CFEDE3; --chipbg:rgba(255,255,255,.06); --warnbg:#3A2A10; --warnfg:#F3C77B;
  --supp:#E28BAE; --supp-soft:#3A1C28; --step-ring:#3DB5C4; --cs1:#24443C; --cs2:#2F5A4F; --cst:#E4F1EC; --cl:#3F9C80; --cb1:#2A2340; --cb2:#231D36; --good:#3FC48F; --bad:#F06B6B; --water:#4FA6D6; --water-2:#7CC0E8; --water-soft:#10293A; --protein:#D9952F; --protein-soft:#33260F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.6);
  color-scheme:dark; --seinsfg:#B9C6F2; --step:#5EEAD4; --step-2:#2DD4BF; --step-soft:#0E3340;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{font-variant-numeric:tabular-nums;background-color:var(--bg);background-image:radial-gradient(140% 460px at 85% -140px,var(--glow) 0%,var(--bg) 72%);background-repeat:no-repeat;color:var(--fg);font:15.5px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(164px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}

.cc-shot{--c:var(--shot);--cs:var(--shot-soft)}.cc-water{--c:var(--water);--cs:var(--water-soft)}.cc-protein{--c:var(--protein);--cs:var(--protein-soft)}
.cc-warn{--c:var(--warnfg);--cs:var(--warnbg)}.cc-bad{--c:var(--bad);--cs:rgba(208,69,69,.1)}

.coach-chk{display:flex;flex-direction:column;gap:7px;margin-top:12px}.coach-chk span{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}.coach-chk span.ok{color:var(--fg)}

.coach-dots i{display:block;height:22px;border-radius:8px;background:var(--sunk);margin-bottom:4px}.coach-dots i.ok{background:var(--c)}.coach-dots .t i{box-shadow:inset 0 0 0 2px var(--c)}

:root[data-hf="dark"] .coach-a button:not(.g){color:#0B1C19}
.coach-n{font-size:12.5px;color:var(--muted);margin-top:10px}@media (max-width:340px){.sync{display:none}}
section{display:flex;flex-direction:column;gap:14px}
.card{background:radial-gradient(130% 70% at 100% 0%,rgba(14,124,102,.06) 0%,transparent 55%),var(--surface);border:1px solid rgba(11,59,51,.05);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.seg{display:grid;grid-template-columns:repeat(6,1fr);background:var(--sunk);border-radius:11px;padding:3px;gap:2px}

.drug .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:10px}

.phase{transition:opacity .2s}
.phgrid span{font-size:12.5px;color:var(--muted)}
.daychip{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.legend span.fat::before{background:var(--fat)}

.today{display:flex;flex-direction:column;gap:16px}
.todayhead{display:flex;justify-content:space-between;align-items:baseline}
.sec{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}

.pv b{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pv small{font-size:14px;color:var(--muted);font-family:var(--f-body)}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.qchips.w button[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
.pring{position:relative;width:96px;height:96px}

/* adımlar (Health Connect, yalnızca Android) */
:root{--step:#0E7490;--step-2:#22B8C8;--step-soft:#DCF2F4}
/* adım kartı: okyanus (petrol mavisi zemin, turkuaz vurgu); her iki temada aynı */
.stcard{--o1:#0F4C6E;--o2:#0A2C42;--oac:#5EEAD4;--osoft:#C3E3EE;--oin:#0C3A55;background:linear-gradient(160deg,var(--o1),var(--o2));color:#fff;padding:20px}

.stnum{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.stnum b{font:700 44px var(--f-display);letter-spacing:-.03em;line-height:1}.stnum small{color:var(--osoft);font-size:14px;margin-left:4px}.stnum em{font:600 14px var(--f-body);font-style:normal;color:var(--oac);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}

.stpills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stpills span{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--osoft);min-width:0}.stpills b{display:block;font:700 16px var(--f-display);color:#fff;white-space:nowrap}

/* son 7 gün yuvarlakları (kartta koyu, sayfada açık/koyu temaya göre) */
.stdays{--dac:var(--step);--dfg:#fff;--din:var(--surface);--dtr:var(--step-soft);--dlab:var(--muted);--dring:var(--surface);display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.stcard .stdays{--dac:var(--oac);--dfg:var(--o2);--din:var(--oin);--dtr:rgba(255,255,255,.16);--dlab:var(--osoft);--dring:var(--o2)}
.stdays>div{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.stdays i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-display);font-style:normal;position:relative}
.stdays i.ok{background:var(--dac);color:var(--dfg)}.stdays i.ok svg{width:14px;height:14px}
.stdays i.p{background:conic-gradient(var(--dac) 0 var(--f),var(--dtr) var(--f) 100%);color:var(--head)}.stcard .stdays i.p{color:#fff}
.stdays i.p::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--din)}.stdays i.p span{position:relative}
.stdays i.td{box-shadow:0 0 0 2px var(--dring),0 0 0 4px var(--dac)}.stcard .stdays i.td{box-shadow:0 0 0 2px var(--o2),0 0 0 4px #fff}

@media (max-width:360px){.stdays i{width:32px;height:32px;font-size:11px}.stnum b{font-size:38px}}

<script>
(function(){
document.documentElement.lang="tr"; // büyük harflerde İ doğru çıksın (TAKVİYELER, HEDEFİN)
const SITES=["Karın sol","Karın sağ","Uyluk sol","Uyluk sağ","Kol sol","Kol sağ"];
const DEFAULT={profile:{drug:"Mounjaro",startWeight:null,goalWeight:null,heightCm:null,intervalDays:7},weights:[],shots:[]};
let S=JSON.parse(JSON.stringify(DEFAULT));
let tab="ozet", docRef=null, mode="local", loaded=false, IS_OWNER=false;
/* Android: veriler ayrıca uygulamanın dosya alanına yazılır; Android'in otomatik yedeklemesi bu dosyayı
   Google hesabına yedekler ve yeni telefonda ilk açılışta buradan geri yüklenir. */
const FSP=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem||null;
let fbT=null;
function fileBackup(){const F=FSP();if(!F)return;clearTimeout(fbT);fbT=setTimeout(()=>{F.writeFile({path:"hafif-veri.json",directory:"DATA",encoding:"utf8",data:JSON.stringify({app:"Hafif",version:1,saved:new Date().toISOString(),data:S})}).catch(()=>{})},700)}
async function fileRestore(){
  try{const r=await FSP().readFile({path:"hafif-veri.json",directory:"DATA",encoding:"utf8"});const j=JSON.parse(r.data),d=j&&j.data;
    if(d&&Array.isArray(d.weights)&&Array.isArray(d.shots)&&(d.weights.length||d.shots.length||(d.profile&&d.profile.onboarded))){
      S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d);try{localStorage.setItem("doz-defteri",JSON.stringify(S))}catch(_){}
      setTimeout(()=>toast("Verilerin yedekten geri yüklendi"),900)}}catch(_){}
}
/* iğne takibi isteğe bağlı: tanımsızsa (eski kayıtlar) açık kabul edilir */
const SHOTS=()=>S.profile.usesShots!==false;
const sinceTxt=()=>SHOTS()&&S.shots.length?"İlk iğneden":"Başlangıçtan";
const shotChip=s=>SHOTS()?"<span><b>"+s.length+"</b> iğne</span>":"";
/* Health Connect (yalnızca Android uygulamasında; Claude'da HP() boş döner) */
const HP=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Health||null;
const HC_READ=["steps","weight","bodyFat"];
/* yedek adım kaynağı: Health Connect'e o gün adım gelmezse telefonun kendi adım sayacı (yalnızca Android) */
const ASP=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.HafifAdim||null;
let PS_TODAY=false;
const stepGoal=()=>S.profile.stepGoal||7500;
/* Claude'da (web) adım bölümü örnek verilerle önizleme olarak görünür; Android uygulamasında gerçek veri gelir */
const PV=()=>!HP()&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const DEMO_ST=[6420,9180,5310,8240,11050,7630,5840];
const DEMO_H=[0,0,0,0,0,0,40,520,860,310,240,420,690,380,260,300,410,520,880,180,90,0,0,0];
const stepsOn=d=>{if(PV()){const a=diffDays(d,today()),i=6-a;if(i>=0&&i<7)return DEMO_ST[i];if(a<0||a>=90)return 0;const x=Math.sin(a*12.9898)*43758.5453;return Math.round((4200+(x-Math.floor(x))*8400)/10)*10}return (S.steps&&S.steps[d])||0};
const fmtN=n=>Math.round(n).toLocaleString("tr-TR");
function stepEst(n){const h=S.profile.heightCm||170,w=sortedW(),k=w.length?w[w.length-1].kg:75;return {km:n*h*0.415/100/1000,kcal:n*0.04*k/70,min:n/100}}
const actionsHtml=()=>SHOTS()?`<div class="actions"><button class="btn" data-open="weight">Kilo gir</button><button class="btn shotbtn" data-open="shot">İğne ekle</button></div>`:`<div class="actions" style="grid-template-columns:1fr"><button class="btn" data-open="weight">Kilo gir</button></div>`;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const toD=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const fmtD=s=>toD(s).toLocaleDateString("tr-TR",{day:"numeric",month:"short",weekday:"short"});
const fmtShort=s=>toD(s).toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
const pctEk=n=>{n=Math.round(n);const b=n%10,o=n%100;const E=["ı","i","si","ü","ü","i","sı","si","i","u"],O=["","u","si","u","ı","si","ı","i","i","ı"];return n===0?"ı":o===0?"ü":b?E[b]:O[o/10]};
const pctTxt=n=>`%${Math.round(n)}'${pctEk(n)}`;
const kg=n=>n==null||isNaN(n)?"–":n.toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
const sgn=n=>(n>0?"+":n<0?"−":"±")+kg(Math.abs(n));
const num=v=>{v=String(v??"").trim().replace(",",".");if(v==="")return null;const n=parseFloat(v);return isNaN(n)?null:n};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* ---------- storage ---------- */
function localLoad(){try{const r=localStorage.getItem("doz-defteri");if(r)S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r))}catch(e){}}
let chain=Promise.resolve(), timer=null, lastSent=null, holdUntil=0;
function save(){
  updTiles();
  clearTimeout(timer);
  timer=setTimeout(()=>{
    const snap=JSON.parse(JSON.stringify(S));
    lastSent=JSON.stringify(snap);
    if(mode==="db"&&docRef){
      $("#sync").textContent="Kaydediliyor…";
      chain=chain.then(()=>docRef.set(snap)).then(()=>{$("#sync").textContent="Hesabına kaydedildi"}).catch(()=>{$("#sync").textContent="Kaydedilemedi, tekrar dene";});
    } else {
      try{localStorage.setItem("doz-defteri",JSON.stringify(snap));$("#sync").textContent="Bu cihazda kayıtlı"}catch(e){$("#sync").textContent="Kayıt yapılamadı"}
    }
    if(typeof remQueue==="function")remQueue();
    if(typeof fileBackup==="function")fileBackup();
    if(typeof widgetSync==="function")widgetSync();
  },250);
}
async function boot(){
  localLoad();
  if(FSP()&&!S.profile.onboarded&&!S.weights.length&&!S.shots.length)await fileRestore();
  render();
  if(!window.claude||!window.claude.use){$("#sync").textContent="Bu cihazda kayıtlı";loaded=true;render();return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){$("#sync").textContent="Bu cihazda kayıtlı";loaded=true;render();return}
    try{IS_OWNER=!!(await user.isOwner())}catch(e){IS_OWNER=false}
    const id=await user.id();
    docRef=db.collection("data/users/"+id).doc("defter");
    mode="db";
    let first=true;
    docRef.onSnapshot(snap=>{
      if(snap.exists){S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(JSON.stringify(snap.data())))}
      else if(first&&(S.weights.length||S.shots.length)){save()} // move local data into the account once
      first=false; loaded=true;
      if(!snap.metadata.hasPendingWrites) $("#sync").textContent="Hesabına kaydedildi";
      if(snap.exists&&lastSent&&JSON.stringify(snap.data())===lastSent) return; // echo of our own write
      const wait=holdUntil-Date.now();
      if(wait>0){setTimeout(()=>{if(!$("#sheetRoot").firstChild)render()},wait);return}
      if(!$("#sheetRoot").firstChild) render();
    },()=>{$("#sync").textContent="Bağlantı koptu, sayfayı yenile"});
  }catch(e){$("#sync").textContent="Bu cihazda kayıtlı";loaded=true;render()}
}

/* ---------- derived ---------- */
const startCut=()=>S.profile.startDate||(S.shots.length?sortedS0()[0].date:"");
const sortedS0=()=>[...S.shots].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const sortedW=()=>[...S.weights].filter(x=>x.date>=startCut()).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
const sortedS=()=>[...S.shots].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function weightAt(date){ // last weigh-in on or before date; else first within 3 days after
  const w=sortedW(); let best=null;
  for(const x of w){if(x.date<=date)best=x;else break}
  if(best)return best;
  const after=w.find(x=>x.date>date&&diffDays(date,x.date)<=3);
  return after||null;
}
function shotRows(){
  const s=sortedS(), w=sortedW(), latest=w[w.length-1];
  return s.map((x,i)=>{
    const a=weightAt(x.date);
    const nxt=s[i+1];
    const b=nxt?weightAt(nxt.date):latest;
    let loss=null;
    if(a&&b&&b!==a&&b.date>=a.date) loss=b.kg-a.kg;
    return {...x,n:i+1,from:a,to:b,loss,current:!nxt};
  });
}
function doseTable(){
  const rows=shotRows(); const m=new Map();
  for(const r of rows){const k=r.dose??"?";const o=m.get(k)||{dose:k,count:0,loss:0,has:false};o.count++;if(r.loss!=null){o.loss+=r.loss;o.has=true}m.set(k,o)}
  return [...m.values()].sort((a,b)=>(+a.dose||0)-(+b.dose||0));
}
const SITE_LBL={"Karın sol":"Karın (sol)","Karın sağ":"Karın (sağ)","Uyluk sol":"Uyluk ön (sol)","Uyluk sağ":"Uyluk ön (sağ)","Kol sol":"Üst kol (sol)","Kol sağ":"Üst kol (sağ)"};
const siteLbl=x=>SITE_LBL[x]||x||"";
/* kullanılan bölgeler: ayarlardan seçilir; seçilmemişse karın + uyluk, geçmişte kol kullanıldıysa kol da */
function activeSites(){const P=S.profile;if(Array.isArray(P.sites)&&P.sites.length)return SITES.filter(x=>P.sites.includes(x));
  const used=new Set(S.shots.map(x=>x.site));return SITES.filter(x=>!x.startsWith("Kol")||used.has(x))}
function siteLast(x){let d=null;S.shots.forEach(y=>{if(y.site===x&&(!d||y.date>d))d=y.date});return d}
/* öneri: seçili bölgeler arasında en uzun süredir kullanılmayan (hiç kullanılmamış olan önce) */
function nextSite(){const A=activeSites();if(!A.length)return SITES[0];let best=A[0],bd=siteLast(A[0]);
  for(const x of A.slice(1)){const d=siteLast(x);if(bd&&(!d||d<bd)){best=x;bd=d}}return best}

function msStrip(){

  const M=milestones(); if(!M) return "";
  const done=M.L.filter(m=>m.done),next=M.L.find(m=>!m.done),last=done[done.length-1];
  const name=m=>m.goal?`Hedef kilo · ${kg(m.kg)} kg`:m.id[0]==="p"?`%${m.id.slice(1)} vücut ağırlığı`:`${m.kg} kg'ın altı`;
  const pr=next?Math.max(0,Math.min(1,((last?last.kg:M.start)-M.cur)/((last?last.kg:M.start)-next.kg))):1;
  const nx=next?`<span class="msn"><i style="width:${Math.round(pr*100)}%"></i></span><small>Sıradaki: ${name(next)} · ${kg(Math.max(0,M.cur-next.kg))} kg kaldı</small>`:`<small>Tüm rozetler senin</small>`;
  return `<button type="button" class="card msstrip" data-go="basari">${last?medal(last,52):next?medal(next,52,pr):""}<span class="nst">${last?`<span class="mse">Son rozet · ${fmtShort(last.done)}</span><b>${name(last)}</b>`:`<span class="mse">İlk rozetin yolda</span><b>${name(next)}</b>`}${nx}</span><span class="msc">${done.length}/${M.L.length}<i>›</i></span></button>`;
}

/* ---------- tahmini ilaç düzeyi (tek kompartımanlı model, Bateman denklemi) ---------- */
const PK={half:5,tmax:1.5,F:0.9}; // yarı ömür 5 gün, zirve 1,5 gün; F: Tracky ile uyumlu ölçek
const KE=Math.log(2)/PK.half;
const KA=(()=>{let lo=KE*1.001,hi=50,m=1;for(let i=0;i<80;i++){m=(lo+hi)/2;const t=Math.log(m/KE)/(m-KE);if(t>PK.tmax)lo=m;else hi=m}return m})();
const shotTime=x=>x.time||"09:00";
const shotTs=x=>{const d=toD(x.date);const[h,mi]=shotTime(x).split(":").map(Number);d.setHours(h||0,mi||0,0,0);return d.getTime()};
const doseMg=x=>num(x.dose)??0;
const one=(dose,days)=>days<=0?0:PK.F*dose*KA/(KA-KE)*(Math.exp(-KE*days)-Math.exp(-KA*days));
const level=(ts,list)=>list.reduce((a,x)=>a+one(doseMg(x),(ts-shotTs(x))/864e5),0);
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const mg=n=>n.toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
const dm=t=>new Date(t).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
function pkState(){
  const now=Date.now(); const all=sortedS(); const past=all.filter(x=>shotTs(x)<=now);
  const last=past[past.length-1]; let next=null;
  if(last){const n={date:addDays(last.date,S.profile.intervalDays||7),time:shotTime(last),dose:planNextDose()||last.dose};if(shotTs(n)>now)next=n}
  const upcoming=all.find(x=>shotTs(x)>now); if(upcoming)next=upcoming;
  return {now,past,last,next,fut:next?past.concat([next]):past};
}
function drugCard(){
  const P=pkState(); if(!P.last) return "";
  const cur=level(P.now,P.past), fromLast=one(doseMg(P.last),(P.now-shotTs(P.last))/864e5), rest=cur-fromLast;
  const before=P.next?level(shotTs(P.next)-6e4,P.past):null;
  const pct=doseMg(P.last)?Math.min(100,fromLast/doseMg(P.last)*100):0;
  return `<div class="card drug" style="display:flex;flex-direction:column;gap:12px">
    <div class="top"><div><span class="eyebrow">Tahmini ilaç düzeyi</span><div class="big">${mg(cur)}<small>mg</small></div></div>
      ${before!=null?`<div style="text-align:right"><span class="eyebrow">Sonraki iğneden önce</span><div class="num" style="font-size:20px">${mg(before)} mg</div><span class="muted" style="font-size:12.5px">${fmtShort(P.next.date)} ${shotTime(P.next)}</span></div>`:""}</div>
    ${drugChart(P)}
    <div class="legend"><span class="dl">Şimdiye kadar</span><span class="dlf">İleriye dönük</span><span class="sd">İğne</span></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;gap:8px"><span class="eyebrow">Son iğneden</span><span class="eyebrow" style="color:var(--shot)">${esc(S.profile.drug||"")} · ${esc(P.last.dose??"?")} mg · ${fmtShort(P.last.date)}</span></div>
      <div class="meter" role="img" aria-label="Son iğneden ${mg(fromLast)} mg aktif"><i style="width:${pct}%"></i><span style="${pct<30?"color:var(--fg)":""}">${mg(fromLast)} mg aktif</span></div>
    </div>
    <div class="kv"><span class="eyebrow">Öncekilerden kalan</span><span class="num" style="font-size:17px">${mg(rest)} mg</span></div>
    <details class="how"><summary>Bu nasıl hesaplanıyor</summary>
      <p>Her iğne ayrı hesaplanıp toplanır. İlaç deri altından yavaşça emilir ve yaklaşık 1,5 günde zirve yapar, sonra 5 günlük yarı ömürle azalır. Önceki iğnelerden kalan miktar bu yüzden sıfırlanmaz ve birikir.</p>
      <p>Bu bir ortalama tahmindir; kan değeri değildir. Kesikli kısım, sıradaki iğneyi planlanan gün ve aynı dozla yaparsan beklenen seyri gösterir.</p></details>
  </div>`;
}
function drugChart(P){
  const first=shotTs(sortedS()[0]);
  const t0=Math.max(first-864e5,P.now-21*864e5);
  const t1=P.next?shotTs(P.next)+4*864e5:P.now+5*864e5;
  const W=340,H=170,L=24,R=8,T=10,B=22, step=3*36e5;
  const past=[],fut=[];
  for(let t=t0;t<P.now;t+=step)past.push([t,level(t,P.past)]);
  const nowV=level(P.now,P.past); past.push([P.now,nowV]); fut.push([P.now,nowV]);
  for(let t=P.now+step;t<=t1;t+=step)fut.push([t,level(t,P.fut)]);
  const mx=Math.max(1,Math.ceil(Math.max(...past.map(p=>p[1]),...fut.map(p=>p[1]))+0.3));
  const x=t=>L+(W-L-R)*(t-t0)/(t1-t0), y=v=>T+(H-T-B)*(1-v/mx);
  const line=a=>a.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  let g="";for(let v=0;v<=mx;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v?'stroke-dasharray="2 4"':""}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif" font-weight="500">${v}</text>`;
  let lab="";for(let i=0;i<4;i++){const t=t0+(t1-t0)*i/3;lab+=`<text x="${x(t)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${i===0?"start":i===3?"end":"middle"}" font-family="Figtree, sans-serif" font-weight="500">${dm(t)}</text>`}
  const dots=P.past.filter(z=>shotTs(z)>=t0).map(z=>`<circle cx="${x(shotTs(z))}" cy="${y(level(shotTs(z),P.past))}" r="4" fill="var(--shot)"/>`).join("");
  const nd=P.next&&shotTs(P.next)<=t1?`<circle cx="${x(shotTs(P.next))}" cy="${y(level(shotTs(P.next),P.past))}" r="4" fill="var(--surface)" stroke="var(--shot)" stroke-width="2" stroke-dasharray="2 2"/>`:"";
  const area=line(past)+`L${x(P.now)} ${y(0)}L${x(past[0][0])} ${y(0)}Z`;
  const sid=SCRUB.push({W,H,L,R,T,B,color:"var(--shot)",pick:vx=>{
    const t=t0+(vx-L)/(W-L-R)*(t1-t0); const v=level(t,t<=P.now?P.past:P.fut);
    return {x:vx,y:y(v),title:mg(v)+" mg",sub:fmtDT(t)+(t>P.now+36e5?" · tahmin":"")};
  }})-1;
  return `<svg class="chart" data-sid="${sid}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tahmini ilaç düzeyi, mg">${g}
    <path class="${A("fade")}" d="${area}" fill="var(--shot)" opacity=".12"/>
    <path class="${A("draw")}" pathLength="1" d="${line(past)}" fill="none" stroke="var(--shot)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line(fut)}" fill="none" stroke="var(--shot)" stroke-width="2" stroke-dasharray="4 4" opacity=".8"/>
    ${dots}${nd}
    <circle cx="${x(P.now)}" cy="${y(nowV)}" r="4.5" fill="var(--surface)" stroke="var(--shot)" stroke-width="2.2"/>
    ${lab}</svg>`;
}
function chartDrugWeight(){
  const w=sortedW(), P=pkState();
  if(!P.past.length) return `<p class="muted" style="margin:0">İlaç düzeyi için en az bir iğne gerekiyor.</p>`;
  const t0=Math.min(toD(w[0].date).getTime(),shotTs(P.past[0])-864e5), t1=P.now;
  const W=340,H=190,L=30,R=26,T=12,B=22, step=3*36e5;
  const pts=[];for(let t=t0;t<=t1;t+=step)pts.push([t,level(t,P.past)]);pts.push([t1,level(t1,P.past)]);
  const mx=Math.max(1,Math.ceil(Math.max(...pts.map(p=>p[1]))+0.3));
  let lo=Math.floor(Math.min(...w.map(z=>z.kg))-0.5), hi=Math.ceil(Math.max(...w.map(z=>z.kg))+0.5);
  const x=t=>L+(W-L-R)*(t-t0)/(t1-t0), yk=v=>T+(H-T-B)*(hi-v)/(hi-lo), ym=v=>T+(H-T-B)*(1-v/mx);
  const kstep=Math.max(1,Math.ceil((hi-lo)/4));
  let g="";for(let v=Math.ceil(lo/kstep)*kstep;v<=hi;v+=kstep)g+=`<line x1="${L}" x2="${W-R}" y1="${yk(v)}" y2="${yk(v)}" stroke="var(--line)"/><text x="${L-5}" y="${yk(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif" font-weight="500">${v}</text>`;
  for(let v=0;v<=mx;v++)g+=`<text x="${W-R+5}" y="${ym(v)+4}" font-size="10" fill="var(--shot)" font-family="Figtree, sans-serif" font-weight="500">${v}</text>`;
  const area=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+ym(p[1]).toFixed(1)).join("")+`L${x(t1)} ${ym(0)}L${x(t0)} ${ym(0)}Z`;
  const wl=w.map((p,i)=>(i?"L":"M")+x(toD(p.date).getTime()+9*36e5).toFixed(1)+" "+yk(p.kg).toFixed(1)).join("");
  const wd=w.map(p=>`<circle cx="${x(toD(p.date).getTime()+9*36e5)}" cy="${yk(p.kg)}" r="2.4" fill="var(--accent)"/>`).join("");
  let lab="";for(let i=0;i<4;i++){const t=t0+(t1-t0)*i/3;lab+=`<text x="${x(t)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${i===0?"start":i===3?"end":"middle"}" font-family="Figtree, sans-serif" font-weight="500">${dm(t)}</text>`}
  const wt=p=>toD(p.date).getTime()+9*36e5;
  const sid=SCRUB.push({W,H,L,R,T,B,pick:vx=>{
    let best=null,bd=1e9; w.forEach((p,i)=>{const d=Math.abs(x(wt(p))-vx);if(d<bd){bd=d;best=i}});
    const p=w[best];
    return {x:x(wt(p)),y:yk(p.kg),title:kg(p.kg)+" kg · "+mg(level(wt(p),P.past))+" mg",sub:fmtD(p.date)};
  }})-1;
  return `<svg class="chart" data-sid="${sid}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo ve tahmini ilaç düzeyi">${g}
    <path class="${A("fade")}" d="${area}" fill="var(--shot)" opacity=".16"/>
    <path class="${A("draw")}" pathLength="1" d="${wl}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${wd}${lab}</svg>
    <p class="muted" style="margin:0;font-size:12.5px">İlaç düzeyinin dibe yaklaştığı günlerde (iğneden hemen önce) kilo düşüşünün yavaşlayıp yavaşlamadığına bak.</p>`;
}

function phaseInfo(){
  const P=pkState(); if(!P.last) return null;
  const iv=S.profile.intervalDays||7, t0=shotTs(P.last);
  const tn=P.next?shotTs(P.next):t0+iv*864e5;
  const total=(tn-t0)/864e5, el=(P.now-t0)/864e5, f=Math.min(1,total/7);
  const ends=[0.75*f,1.5*f,3.25*f,5*f,Math.max(5*f+0.25,total-1),total];
  const starts=[0,...ends.slice(0,-1)];
  let cur=ends.findIndex(e=>el<e); const overdue=cur<0; if(overdue)cur=5;
  return {P,t0,tn,total,el,ends,starts,cur,overdue,day:Math.max(1,diffDays(P.last.date,today())),days:Math.round(total)};
}
let selPhase=null, phAllOpen=false;
function phaseBlock(){return `<div id="phaseWrap" style="display:flex;flex-direction:column;gap:14px">${phaseInner()}</div>`}
function phaseInner(){
  const I=phaseInfo(); if(!I) return "";
  const at=d=>I.t0+d*864e5;
  const ymdL=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
  const rng=i=>{const a=fmtShort(ymdL(at(I.starts[i]))),b=fmtShort(ymdL(at(I.ends[i])-1));return a===b?a:a+" – "+b};
  const sel=selPhase??I.cur, ph=PHASES[sel], isCur=sel===I.cur;
  const bar=PHASES.map((p,i)=>{const w=i<I.cur?100:i>I.cur?0:Math.max(4,Math.min(100,(I.el-I.starts[i])/(I.ends[i]-I.starts[i])*100));return `<button type="button" data-ph="${i}" class="${i===sel?"on":""}${i===I.cur?" cur":""}" aria-pressed="${i===sel}" aria-label="${p.k} aşamasını göster"><i><b style="width:${I.overdue?100:w}%"></b></i><span>${p.k}</span></button>`}).join("");
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="eyebrow">Döngü</span><span class="daychip">${I.days} günün ${I.day}. günü</span></div>
  <div class="phbar">${bar}</div>
  <div class="phase">
    <h3><span>${ph.k}</span><span class="eyebrow" style="color:${isCur?"var(--shot)":"var(--muted)"}">${isCur?"Bugün · ":""}Evre ${sel+1}/6</span></h3>
    ${isCur?"":`<span class="muted" style="font-size:12.5px;margin-top:-6px">${rng(sel)} · ${sel<I.cur?"bu döngüde geçti":"bu döngüde gelecek"}</span>`}
    <p>${isCur&&I.overdue?"Planlanan iğne zamanı geçti. İlaç düzeyi düşmeye devam ediyor; iğneni yaptıysan buraya eklemeyi unutma.":ph.txt}</p>
    <ul class="tips">${ph.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
    ${isCur?"":`<button type="button" class="linkbtn" data-ph="${I.cur}" style="align-self:flex-start;padding:0">Şu anki aşamaya dön (${PHASES[I.cur].k})</button>`}
  </div>
  <details class="how" id="phAll" ${phAllOpen?"open":""}><summary>Tüm aşamalar</summary>
    <div class="phgrid">${PHASES.map((p,i)=>`<button type="button" data-ph="${i}" class="${i===sel?"on":""}"><b>${p.k}${i===I.cur?" •":""}</b><span>${rng(i)}</span></button>`).join("")}</div>
    <p>Aşamalar son iğnenin saatinden ve tahmini ilaç düzeyinden hesaplanır. Genel bilgidir, tıbbi tavsiye değildir; herkesin deneyimi farklıdır.</p></details>`;
}
function chartFat(){
  const w=sortedW().filter(x=>x.fat!=null);
  if(w.length<2) return `<p class="muted" style="margin:0">Yağ oranı grafiği için en az iki tartıda yağ oranı gerekiyor. Kilo girerken yağ oranını da yazabilirsin.</p>`;
  const W=340,H=200,L=30,R=30,T=14,B=22;
  const d0=w[0].date,d1=w[w.length-1].date,span=Math.max(1,diffDays(d0,d1));
  const fm=x=>x.kg*x.fat/100;
  let lo=Math.floor(Math.min(...w.map(x=>x.fat))-0.5),hi=Math.ceil(Math.max(...w.map(x=>x.fat))+0.5);
  const mlo=Math.floor(Math.min(...w.map(fm))-1),mhi=Math.ceil(Math.max(...w.map(fm))+1);
  const x=d=>L+(W-L-R)*diffDays(d0,d)/span, y=v=>T+(H-T-B)*(hi-v)/(hi-lo), ym=v=>T+(H-T-B)*(mhi-v)/(mhi-mlo);
  const st=Math.max(1,Math.ceil((hi-lo)/4));
  let g="";for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--fat)" font-family="Figtree, sans-serif" font-weight="500">%${v}</text>`;
  const ms=Math.max(1,Math.ceil((mhi-mlo)/4));
  for(let v=Math.ceil(mlo/ms)*ms;v<=mhi;v+=ms)g+=`<text x="${W-R+5}" y="${ym(v)+4}" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif" font-weight="500">${v}</text>`;
  const bw=Math.max(2,Math.min(8,(W-L-R)/span*0.6));
  const bars=w.map(p=>`<rect x="${x(p.date)-bw/2}" y="${ym(fm(p))}" width="${bw}" height="${H-B-ym(fm(p))}" rx="1.5" fill="var(--accent)" opacity=".16"/>`).join("");
  const line=w.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+" "+y(p.fat).toFixed(1)).join("");
  const shots=sortedS().filter(z=>z.date>=d0&&z.date<=d1).map(z=>`<line x1="${x(z.date)}" x2="${x(z.date)}" y1="${T}" y2="${H-B}" stroke="var(--shot)" stroke-dasharray="3 3" opacity=".5"/>`).join("");
  const fs=sortedS()[0]; const a=(fs&&w.find(p=>p.date>=fs.date))||w[0], b=w[w.length-1];
  const sid=SCRUB.push({W,H,L,R,T,B,color:"var(--fat)",pick:vx=>{
    let bi=0,bd=1e9;w.forEach((p,i)=>{const d=Math.abs(x(p.date)-vx);if(d<bd){bd=d;bi=i}});
    const p=w[bi];return {x:x(p.date),y:y(p.fat),title:"%"+p.fat.toLocaleString("tr-TR",{minimumFractionDigits:1})+" · "+kg(fm(p))+" kg yağ",sub:fmtD(p.date)+" · "+kg(p.kg)+" kg"};
  }})-1;
  const pct=n=>n.toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
  return `<svg class="chart" data-sid="${sid}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vücut yağ oranı">${g}${shots}${bars}
    <path class="${A("draw")}" pathLength="1" d="${line}" fill="none" stroke="var(--fat)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(b.date)}" cy="${y(b.fat)}" r="4.5" fill="var(--fat)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtShort(d0)}</text><text x="${W-R}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtShort(d1)}</text></svg>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Yağ %</span><div class="v">${sgn(b.fat-a.fat)}</div></div>
      <div class="stat"><span class="eyebrow">Yağ kg</span><div class="v">${sgn(fm(b)-fm(a))}</div></div>
      <div class="stat"><span class="eyebrow">Yağsız kg</span><div class="v">${sgn((b.kg-fm(b))-(a.kg-fm(a)))}</div></div>
    </div>
    <p class="muted" style="margin:0;font-size:12.5px">${fs&&a.date>=fs.date?"İlk iğneden ("+fmtShort(a.date)+")":fmtShort(a.date)+" tarihinden"} bu yana verdiğin ${kg(a.kg-b.kg)} kg'ın ${kg(fm(a)-fm(b))} kg'ı yağ (%${Math.round((fm(a)-fm(b))/(a.kg-b.kg)*100)}). Tartıların ölçtüğü yağ oranı su durumuna göre oynar; tek tek günlerden çok genel yöne bak.</p>`;
}

}

/* ---------- ara hedefler & kutlama ---------- */
function trendInfo(){
  const w=sortedW(); if(w.length<2) return null;
  const ma=w.map(p=>{const from=addDays(p.date,-6);const win=w.filter(q=>q.date>=from&&q.date<=p.date);return {date:p.date,kg:win.reduce((a,b)=>a+b.kg,0)/win.length}});
  const last=ma[ma.length-1], rec=ma.filter(p=>p.date>=addDays(last.date,-14)), f=rec[0];
  return {cur:last.kg,slope:(last.kg-f.kg)/Math.max(1,diffDays(f.date,last.date)),date:last.date};
}
function milestones(){
  const w=sortedW(); if(w.length<2) return null;
  const start=w[0].kg, goal=S.profile.goalWeight, floor=goal??start*0.75, L=[];
  for(let k=Math.floor((start-0.01)/5)*5;k>floor+0.01;k-=5)L.push({id:"kg"+k,kg:k,t:`${k}`,u:"kg",s:`${k} kg`});
  [5,10,15,20,25].forEach(p=>{const k=Math.round(start*(1-p/100)*10)/10;if(k>=floor-0.01)L.push({id:"p"+p,kg:k,t:`%${p}`,u:"",s:`vücut ağırlığı · ${kg(k)} kg`})});
  if(goal!=null)L.push({id:"goal",kg:goal,t:"Hedef",u:"",s:`${kg(goal)} kg`,goal:true});
  L.sort((a,b)=>b.kg-a.kg);
  const T=trendInfo();
  for(const m of L){const hit=w.find(x=>x.kg<=m.kg+1e-9);m.done=hit?hit.date:null;
    if(!m.done&&T&&T.slope<-0.01)m.eta=addDays(T.date,Math.ceil((T.cur-m.kg)/-T.slope))}
  return {L,start,cur:w[w.length-1].kg};
}

function nextMsHtml(M){
  const done=M.L.filter(m=>m.done), next=M.L.find(m=>!m.done), last=done[done.length-1];

async function syncHealth(force){
  const H=HP(); if(!H||!(S.hc&&S.hc.on)||hcBusy) return; if(!force&&Date.now()-hcLast<60000) return;
  hcBusy=true; hcLast=Date.now(); let changed=false; const hcDays={};
  const iso=d=>toD(d).toISOString();
  try{
    const r=await H.queryAggregated({dataType:"steps",startDate:iso(addDays(today(),-89)),endDate:new Date().toISOString(),bucket:"day",aggregation:"sum"});
    S.steps=S.steps||{}; for(const b of (r&&r.samples)||[]){const d=ymd(new Date(b.startDate).getTime()+36e5*12);const v=Math.round(b.value||0);if(v>0)hcDays[d]=v;if(S.steps[d]!==v){S.steps[d]=v;changed=true}}
    for(const d of Object.keys(S.steps))if(d<addDays(today(),-90))delete S.steps[d];
  }catch(_){}
  try{
    const r=await H.queryAggregated({dataType:"steps",startDate:iso(today()),endDate:new Date().toISOString(),bucket:"hour",aggregation:"sum"});
    const h=Array(24).fill(0); for(const b of (r&&r.samples)||[])h[new Date(b.startDate).getHours()]+=Math.round(b.value||0); HOURS=h;
  }catch(_){}
  S.hc.empty=!Object.keys(hcDays).length; PS_TODAY=false;
  if(S.ps&&S.ps.on&&ASP())try{
    const st=await ASP().durum();
    if(!st.izin||!st.acik){S.ps.on=false;changed=true}
    else{const p=await ASP().oku();
      for(const [d,v] of Object.entries(p.gunler||{}))if(!(hcDays[d]>0)&&v>0&&S.steps[d]!==v){S.steps[d]=v;changed=true}
      if(!(hcDays[today()]>0)&&p.saatler){HOURS=p.saatler.map(x=>+x||0);PS_TODAY=true}}
  }catch(_){}
  try{
    const from=S.hc.wFrom||addDays(today(),-30);
    const [wr,fr]=await Promise.all([H.readSamples({dataType:"weight",startDate:iso(from),endDate:new Date().toISOString(),limit:500,ascending:true}).catch(()=>null),H.readSamples({dataType:"bodyFat",startDate:iso(from),endDate:new Date().toISOString(),limit:500,ascending:true}).catch(()=>null)]);
    const seen=new Set(S.weights.map(x=>x.hcId).filter(Boolean));
    for(const x of (wr&&wr.samples)||[]){const id=x.platformId||(x.startDate+x.value);if(seen.has(id))continue;seen.add(id);
      const d=ymd(new Date(x.startDate).getTime()),k=Math.round(x.value*100)/100; if(!(k>=20&&k<=400))continue;
      if(S.weights.some(w=>w.date===d&&Math.abs(w.kg-k)<0.15))continue;
      S.weights.push({id:uid(),date:d,kg:k,fat:null,note:null,src:"hc",hcId:id,t:new Date(x.startDate).getTime()});if(S.profile.startWeight==null)S.profile.startWeight=k;changed=true}
    for(const x of (fr&&fr.samples)||[]){const d=ymd(new Date(x.startDate).getTime()),f=Math.round(x.value*10)/10; if(!(f>=3&&f<=70))continue;
      const w=S.weights.filter(w=>w.date===d&&w.fat==null).sort((a,b)=>Math.abs((a.t||0)-new Date(x.startDate).getTime())-Math.abs((b.t||0)-new Date(x.startDate).getTime()))[0];
      if(w){w.fat=f;changed=true}}
    S.hc.wFrom=today();
  }catch(_){}
  S.hc.last=Date.now(); hcBusy=false; save();
  if(changed||tab==="adim"){if(!$("#sheetRoot").firstChild&&!$("#onb")&&(tab==="ozet"||tab==="adim"||tab==="kilo"))render()}
}

        if(el.value.trim()&&(v==null||v<d[1]||v>d[2])){toast(`${d[0]} ${d[1]}–${d[2]}${UNIT[id]?" "+UNIT[id]:""} arasında olmalı`);const P=S.profile,old={"a-start":P.startWeight,"a-goal":P.goalWeight,"a-height":P.heightCm,"a-age":P.age,"a-prot":P.proteinGoal,"a-water":P.waterGoal,"a-iv":P.intervalDays??7,"a-step":P.stepGoal}[id];el.value=old==null?"":String(old).replace(".",",");return}}
      const ps=[...document.querySelectorAll("[data-psite]")].filter(b=>b.getAttribute("aria-pressed")==="true").map(b=>b.dataset.psite);
      const shotsBefore=SHOTS();
      S.profile={...S.profile,sites:ps.length?ps:null,usesShots:$("#a-shots").checked,onboarded:true,age:(n=>n&&n>=10&&n<=110?Math.round(n):null)(num($("#a-age").value)),sex:$("#a-sex").value||null,noCelebrate:!$("#a-cel").checked,drug:$("#a-drug").value.trim()||null,startWeight:num($("#a-start").value),goalWeight:num($("#a-goal").value),heightCm:num($("#a-height").value),proteinGoal:(n=>n&&n>0?Math.round(n):null)(num($("#a-prot").value)),waterGoal:(n=>n&&n>0?Math.round(n):null)(num($("#a-water").value)),stepGoal:$("#a-step")?(n=>n&&n>=500?Math.round(n):null)(num($("#a-step").value)):(S.profile.stepGoal??null),intervalDays:Math.max(1,Math.round(num($("#a-iv").value)||7))};
      save();toast(`${d[0]} kaydedildi ✓`);
      if(SHOTS()!==shotsBefore){const y=scrollY;render();scrollTo(0,y)}
    };
    f.addEventListener("change",e=>{const id=e.target.id;if(id)applyAyar(id)});
    f.addEventListener("submit",e=>{e.preventDefault();if(document.activeElement)document.activeElement.blur()});
    v.querySelectorAll("[data-psite]").forEach(b=>b.addEventListener("click",()=>applyAyar("a-sites")));
  }
}
