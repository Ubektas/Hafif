<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hafif</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-column phone app, summary card on top, bottom tab bar, add sheets slide up from the bottom */
:root{
  /* Layout: one-column phone app; light porcelain ground with emerald-tinted neutrals; the summary hero is the one dark "Zümrüt" piece and buttons echo it */
  --bg:#F1F5F3; --glow:#DDEFE7; --surface:#FFFFFF; --surface-2:#FFFFFF; --sunk:#EDF3F0; --fg:#0B2420; --muted:#5F726C; --line:#E0E8E4;
  --accent:#0E7C66; --accent-soft:#E1F3EC; --accent-ink:#FFFFFF; --fat:#7B5BD0; --fat-soft:#EEE9FB; --shot:#E2643D; --shot-soft:#FCEDE7; --protein-ink:#8A5A10; --mint:#9FF0D6;
  --emerald-1:#126B58; --emerald-2:#0B3B33;
  --good:#12855D; --bad:#D04545; --water:#2C8FE0; --water-2:#7CC0F4; --water-soft:#E7F3F6; --protein:#D08A1E; --protein-soft:#FDF3E2;
  --shadow:0 1px 2px rgba(11,36,32,.04),0 14px 34px -18px rgba(11,59,51,.22);
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, sans-serif;
  --f-num:"Figtree", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{font-variant-numeric:tabular-nums;background-color:var(--bg);background-image:radial-gradient(140% 460px at 85% -140px,var(--glow) 0%,var(--bg) 72%);background-repeat:no-repeat;color:var(--fg);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;color:var(--emerald-2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .wm{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.03em;line-height:1;display:flex;align-items:center;gap:8px}
.brand .wm svg{width:24px;height:24px;color:var(--accent)}
.brand .dt{font-size:13px;color:var(--muted)}
.hero2{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--accent-soft) 0%,var(--surface) 62%);padding:22px;display:flex;flex-direction:column;gap:16px}
.hero2 .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mega{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.9;letter-spacing:-.045em;color:var(--fg);font-variant-numeric:tabular-nums}
.mega small{font-size:22px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.fromto{font-family:var(--f-num);font-size:14px;color:var(--muted)}
.fromto b{color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12.5px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--fg)}
.chips span b{font-family:var(--f-num);font-weight:500}
.ring{flex:none;position:relative;width:86px;height:86px}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ring .lbl b{font-family:var(--f-display);font-size:20px;color:var(--fg);letter-spacing:-.02em;text-transform:none}
.goalset{flex:none;font:600 12px var(--f-body);color:var(--accent);background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:8px 10px;cursor:pointer}
.comp{display:flex;flex-direction:column;gap:14px}
.comp3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.comp3 .v{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1.05}
.comp3 .s{font-size:12px;color:var(--muted)}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px}
.split i{display:block;height:100%;border-radius:99px}
.splitlbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px}
.splitlbl b{font-family:var(--f-num);font-weight:500;color:var(--fg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid rgba(11,59,51,.05);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.03em}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.tile .s{font-size:12px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted)}
section{display:flex;flex-direction:column;gap:14px}
.card{background:radial-gradient(130% 70% at 100% 0%,rgba(14,124,102,.06) 0%,transparent 55%),var(--surface);border:1px solid rgba(11,59,51,.05);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.big{font-family:var(--f-display);font-size:42px;line-height:1;letter-spacing:-.04em;font-weight:700}
.big small{font-size:16px;color:var(--muted);margin-left:2px}
.delta{font-family:var(--f-num);font-size:14px}
.delta.down{color:var(--good)} .delta.up{color:var(--bad)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barlabel{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-8px}
.next{display:flex;gap:14px;align-items:center}
.pen{flex:none;width:52px;height:52px;border-radius:16px;background:var(--shot-soft);display:grid;place-items:center;color:var(--shot)}
.next b{font-family:var(--f-display);font-size:18px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:14px;padding:12px}
.stat .v{font-family:var(--f-num);font-size:17px;margin-top:2px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--accent)}
.legend span.s::before{background:var(--shot);width:3px;height:10px}

.seg{display:grid;grid-template-columns:repeat(6,1fr);background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:500 11.5px var(--f-body);color:var(--muted);padding:7px 2px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend span.b::before{width:10px;height:10px;border-radius:3px}
.legend span.b.live::before{opacity:.45}
.legend span.dot::before{width:6px;height:6px;border-radius:9px;background:var(--muted)}
.legend span.dash::before{background:none;border-top:2px dashed var(--accent);height:0}
.legend span.area::before{background:var(--shot);opacity:.35;height:10px;border-radius:2px}
.legend span.dl::before{background:var(--shot)}
.legend span.dlf::before{background:none;border-top:2px dashed var(--shot);height:0}
.legend span.sd::before{width:8px;height:8px;border-radius:9px;background:var(--shot)}
.drug .top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.meter{height:22px;background:var(--sunk);border-radius:8px;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--shot);border-radius:8px}
.meter span{position:relative;font:500 11px var(--f-num);color:#fff;line-height:22px;padding-left:8px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
details.how{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;font-weight:600;color:var(--fg);list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:" +";color:var(--muted)}
details.how[open] summary::after{content:" −"}
details.how p{margin:8px 0 0}
.chart[data-sid]{touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.phbar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.phbar button{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;border:0;background:none;padding:6px 0 4px;border-radius:10px;cursor:pointer;font:inherit}
.phbar button.on{background:var(--shot-soft)}
.phbar button.cur i{box-shadow:0 0 0 2px var(--shot-soft)}
.phgrid button{border:0;background:none;text-align:left;padding:6px;margin:-6px;border-radius:10px;cursor:pointer;font:inherit}
.phgrid button.on{background:var(--surface)}
.phbar i{display:block;width:100%;height:5px;border-radius:9px;background:var(--sunk);overflow:hidden}
.phbar i b{display:block;height:100%;background:var(--shot);border-radius:9px}
.phbar span{font-size:8.5px;letter-spacing:0;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.15;font-weight:600}
.phbar .on span{color:var(--shot)}
.phase{background:var(--sunk);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.phase h3{font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phase p{margin:0}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.tips li{display:grid;grid-template-columns:14px 1fr;gap:8px}
.tips li::before{content:"";width:6px;height:6px;border-radius:9px;background:var(--shot);margin-top:8px}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:10px}
.phgrid b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg)}
.phgrid .on b{color:var(--shot)}
.phase{transition:opacity .2s}
.phgrid span{font-size:12px;color:var(--muted)}
.daychip{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.legend span.fat::before{background:var(--fat)}

.today{display:flex;flex-direction:column;gap:16px}
.todayhead{display:flex;justify-content:space-between;align-items:baseline}
.sec{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.pv{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display)}
.pv b{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pv small{font-size:14px;color:var(--muted);font-family:var(--f-body)}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qchips button{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--f-num);padding:7px 10px;border-radius:11px;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
.qchips button:active{transform:scale(.92)}
.qchips.p button{background:var(--protein-soft);border-color:transparent;color:var(--protein-ink)}
.qchips.w button[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
.pring{position:relative;width:96px;height:96px}
.pring svg circle.v{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.pring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pring .c b{font-family:var(--f-display);font-size:20px;color:var(--fg);letter-spacing:-.02em;text-transform:none}
.inl{display:flex;gap:6px;margin-top:8px}
.inl input{padding:8px 10px;font-size:15px}
.inl button{border:0;border-radius:11px;background:var(--protein);color:#fff;font:600 14px var(--f-body);padding:0 14px;cursor:pointer}
.hr{height:1px;background:var(--line)}
.gwrap{position:relative;width:96px;height:150px;display:flex;justify-content:center}
.glass{position:relative;width:84px;height:140px;margin-top:10px;border:2.5px solid #CFE3F4;border-top-width:0;border-radius:6px 6px 26px 26px;background:var(--water-soft);overflow:hidden;box-shadow:inset 0 -6px 14px -10px rgba(44,143,224,.5)}
.glass::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:#CFE3F4;border-radius:3px;z-index:3}
.glass::after{content:"";position:absolute;top:10px;left:9px;width:7px;height:70%;border-radius:9px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));z-index:3}
.liquid{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(var(--water-2),var(--water));transition:height 1s cubic-bezier(.2,.8,.2,1)}
.wave{position:absolute;left:0;top:-9px;width:200%;height:10px;animation:wave 2.6s linear infinite}
.wave.b{top:-7px;opacity:.55;animation-duration:4.2s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(-50%)}}
.bub{position:absolute;bottom:4px;width:5px;height:5px;border-radius:9px;background:rgba(255,255,255,.7);animation:bub 3.4s ease-in infinite;opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-110px);opacity:0}}
.ticks{position:absolute;right:6px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;z-index:2;pointer-events:none}
.ticks i{display:block;width:10px;height:1.5px;background:rgba(44,143,224,.35)}
.drop{position:absolute;left:50%;top:0;width:12px;height:16px;margin-left:-6px;background:var(--water);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;z-index:4;opacity:0;pointer-events:none}
.ripple{position:absolute;left:50%;width:20px;height:6px;margin-left:-10px;border:2px solid rgba(255,255,255,.9);border-radius:50%;z-index:4;pointer-events:none}
.badge{position:absolute;top:-2px;right:-6px;z-index:5;background:var(--good);color:#fff;font:700 10px var(--f-body);border-radius:99px;padding:3px 7px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.badge.on{transform:scale(1)}
.wctl{display:flex;flex-direction:column;gap:8px}
input[type=range].wr{-webkit-appearance:none;appearance:none;height:6px;padding:0;border:0;border-radius:9px;background:linear-gradient(to right,var(--water) var(--p,40%),var(--water-soft) var(--p,40%))}
input[type=range].wr::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--water);box-shadow:0 2px 6px rgba(0,0,0,.18)}
input[type=range].wr::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--water)}
.btn.waterbtn{background:var(--water);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.btn.waterbtn:active{transform:scale(.96)}
.btn.waterbtn b{font-family:var(--f-num);font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
[hidden]{display:none!important}
.week>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.week .bars{display:flex;gap:3px;align-items:flex-end;height:38px}
.week .bars i{display:block;width:7px;border-radius:4px;min-height:3px;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.week span{font-size:10.5px;color:var(--muted)}
.week .on span{color:var(--fg);font-weight:700}
.linkbtn{border:0;background:none;color:var(--muted);font:500 13px var(--f-body);padding:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.wave,.bub{animation:none}.liquid,.pring svg circle.v,.week .bars i{transition:none}}

.psec{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center}
.pplate{position:relative;width:128px;height:128px}
.pplate .plate{position:absolute;inset:0}
.pit{position:absolute;width:28px;height:28px;transform:rotate(var(--r));filter:drop-shadow(0 1.5px 1.5px rgba(14,26,27,.18))}
.pit.pop{animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:translateY(-26px) scale(.2) rotate(var(--r));opacity:0}60%{opacity:1}100%{transform:rotate(var(--r))}}
.pempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.pmore{position:absolute;right:6px;bottom:6px;background:var(--protein);color:#fff;font:700 11px var(--f-body);border-radius:99px;padding:2px 7px}
.pfloat{position:absolute;left:50%;top:44px;font:700 15px var(--f-display);color:var(--protein);pointer-events:none;white-space:nowrap}
.foods{display:grid;grid-auto-flow:column;grid-auto-columns:104px;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.foods::-webkit-scrollbar{display:none}
.food{scroll-snap-align:start;border:1px solid var(--line);background:linear-gradient(180deg,#FFFFFF,var(--protein-soft));border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--f-body);color:var(--fg);transition:transform .12s}
.food:active{transform:scale(.94)}
.food .fn{font-size:12.5px;font-weight:600;text-align:center;line-height:1.15}
.food .fd{font-size:11px;color:var(--muted);white-space:nowrap}
.food .fd b{color:var(--protein-ink);font-weight:700}
.pick{background:var(--protein-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:-6px}
.pickrow{display:flex;align-items:center;gap:10px}
.pickv{font-family:var(--f-display);font-size:14px;color:var(--muted)}
.pickv b{font-size:30px;color:var(--protein-ink);letter-spacing:-.03em}
input[type=range].pr{-webkit-appearance:none;appearance:none;height:6px;padding:0;border:0;border-radius:9px;background:linear-gradient(to right,var(--protein) var(--p,50%),var(--sunk) var(--p,50%))}
input[type=range].pr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--protein);box-shadow:0 2px 6px rgba(0,0,0,.18)}
input[type=range].pr::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--protein)}
.pickscale{display:flex;justify-content:space-between;font:500 11px var(--f-num);color:var(--muted);margin-top:-4px}
.gwrap2{position:relative;width:112px;height:196px}


.hdots{display:flex;align-items:center;justify-content:center;gap:2px;margin:-4px 0 -8px}
.hdots button{width:22px;height:22px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.hdots button::before{content:"";width:6px;height:6px;border-radius:9px;background:var(--line);transition:width .2s,background .2s}
.hdots button[aria-selected="true"]::before{width:16px;background:var(--accent)}
.hdots span{font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.04em}
.hdots.dk button::before{background:rgba(255,255,255,.3)}.hdots.dk button[aria-selected="true"]::before{background:#9FF0D6}.hdots.dk span{color:rgba(255,255,255,.6)}
.hero-yol{display:flex;flex-direction:column;gap:12px;padding:22px}
.track{position:relative;height:74px;margin:6px 6px 0}
.track .rail{position:absolute;left:0;right:0;top:28px;height:8px;border-radius:9px;background:var(--sunk)}
.track .done{position:absolute;left:0;top:28px;height:8px;border-radius:9px;background:linear-gradient(90deg,#7FD3B8,var(--accent))}
.track i{position:absolute;top:24px;width:2px;height:16px;margin-left:-1px;background:var(--surface);border-radius:2px}
.track em{position:absolute;top:44px;transform:translateX(-50%);font:500 10px var(--f-num);color:var(--muted);font-style:normal}

.chip.live{background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent)}
table.doses{width:100%;border-collapse:collapse;font-size:14px}
table.doses th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:0 0 8px}

table.doses td.r,table.doses th.r{text-align:right}

.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* buttons & forms */
.btn{appearance:none;border:0;border-radius:16px;padding:14px 16px;box-shadow:0 10px 22px -12px rgba(11,59,51,.55);font:600 15px var(--f-body);cursor:pointer;background:linear-gradient(160deg,var(--emerald-1),var(--emerald-2));color:#fff}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.shotbtn{background:var(--shot);color:#fff}
.btn:focus-visible,.tab:focus-visible,.del:focus-visible,input:focus-visible,select:focus-visible,.site:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:16px var(--f-body);color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
input.bignum{font:500 28px var(--f-num);text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.site{border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:10px;padding:10px 4px;font:500 13px var(--f-body);cursor:pointer}
.site[aria-pressed="true"]{background:var(--shot);color:#fff;border-color:var(--shot)}
.site .sug{display:block;font-size:10px;opacity:.8}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{border:0;background:none;color:var(--muted);font:500 11px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:92%;overflow:auto;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30}

<script>
(function(){
const SITES=["Karın sol","Karın sağ","Uyluk sol","Uyluk sağ","Kol sol","Kol sağ"];
const DEFAULT={profile:{drug:"Mounjaro",startWeight:null,goalWeight:null,heightCm:null,intervalDays:7},weights:[],shots:[]};
let S=JSON.parse(JSON.stringify(DEFAULT));
let tab="ozet", docRef=null, mode="local", loaded=false, IS_OWNER=false;
/* Android: veriler ayrıca uygulamanın dosya alanına yazılır; Android'in otomatik yedeklemesi bu dosyayı
   Google hesabına yedekler ve yeni telefonda ilk açılışta buradan geri yüklenir. */
const FSP=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem||null;
let fbT=null;
function fileBackup(){const F=FSP();if(!F)return;clearTimeout(fbT);fbT=setTimeout(()=>{F.writeFile({path:"hafif-veri.json",directory:"DATA",encoding:"utf8",data:JSON.stringify({app:"Hafif",version:1,saved:new Date().toISOString(),data:S})}).catch(()=>{})},700)}
async function fileRestore(){
  try{const r=await FSP().readFile({path:"hafif-veri.json",directory:"DATA",encoding:"utf8"});const j=JSON.parse(r.data),d=j&&j.data;
    if(d&&Array.isArray(d.weights)&&Array.isArray(d.shots)&&(d.weights.length||d.shots.length||(d.profile&&d.profile.onboarded))){
      S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d);try{localStorage.setItem("doz-defteri",JSON.stringify(S))}catch(_){}
      setTimeout(()=>toast("Verilerin yedekten geri yüklendi"),900)}}catch(_){}
}
/* iğne takibi isteğe bağlı: tanımsızsa (eski kayıtlar) açık kabul edilir */
const SHOTS=()=>S.profile.usesShots!==false;
const sinceTxt=()=>SHOTS()&&S.shots.length?"İlk iğneden":"Başlangıçtan";
const shotChip=s=>SHOTS()?"<span><b>"+s.length+"</b> iğne</span>":"";
/* Health Connect (yalnızca Android uygulamasında; Claude'da HP() boş döner) */
const HP=()=>window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Health||null;
const HC_READ=["steps","weight","bodyFat"];
const stepGoal=()=>S.profile.stepGoal||7500;
/* Claude'da (web) adım bölümü örnek verilerle önizleme olarak görünür; Android uygulamasında gerçek veri gelir */
const PV=()=>!HP()&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const DEMO_ST=[6420,9180,5310,8240,11050,7630,5840];
const DEMO_H=[0,0,0,0,0,0,40,520,860,310,240,420,690,380,260,300,410,520,880,180,90,0,0,0];
const stepsOn=d=>{if(PV()){const i=6-diffDays(d,today());return i>=0&&i<7?DEMO_ST[i]:0}return (S.steps&&S.steps[d])||0};
const fmtN=n=>Math.round(n).toLocaleString("tr-TR");
function stepEst(n){const h=S.profile.heightCm||170,w=sortedW(),k=w.length?w[w.length-1].kg:75;return {km:n*h*0.415/100/1000,kcal:n*0.04*k/70,min:n/100}}
const actionsHtml=()=>SHOTS()?`<div class="actions"><button class="btn" data-open="weight">Kilo gir</button><button class="btn shotbtn" data-open="shot">İğne ekle</button></div>`:`<div class="actions" style="grid-template-columns:1fr"><button class="btn" data-open="weight">Kilo gir</button></div>`;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const toD=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const fmtD=s=>toD(s).toLocaleDateString("tr-TR",{day:"numeric",month:"short",weekday:"short"});
const fmtShort=s=>toD(s).toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
const kg=n=>n==null||isNaN(n)?"–":n.toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
const sgn=n=>(n>0?"+":n<0?"−":"±")+kg(Math.abs(n));
const num=v=>{v=String(v??"").trim().replace(",",".");if(v==="")return null;const n=parseFloat(v);return isNaN(n)?null:n};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* ---------- storage ---------- */
function localLoad(){try{const r=localStorage.getItem("doz-defteri");if(r)S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r))}catch(e){}}
let chain=Promise.resolve(), timer=null, lastSent=null, holdUntil=0;
function save(){
  clearTimeout(timer);
  timer=setTimeout(()=>{
    const snap=JSON.parse(JSON.stringify(S));
    lastSent=JSON.stringify(snap);
    if(mode==="db"&&docRef){
      $("#sync").textContent="Kaydediliyor…";
      chain=chain.then(()=>docRef.set(snap)).then(()=>{$("#sync").textContent="Hesabına kaydedildi"}).catch(()=>{$("#sync").textContent="Kaydedilemedi, tekrar dene";});
    } else {
      try{localStorage.setItem("doz-defteri",JSON.stringify(snap));$("#sync").textContent="Bu cihazda kayıtlı"}catch(e){$("#sync").textContent="Kayıt yapılamadı"}
    }
    if(typeof remQueue==="function")remQueue();
    if(typeof fileBackup==="function")fileBackup();
  },250);
}
async function boot(){
  localLoad();
  if(FSP()&&!S.profile.onboarded&&!S.weights.length&&!S.shots.length)await fileRestore();
  render();
  if(!window.claude||!window.claude.use){$("#sync").textContent="Bu cihazda kayıtlı";loaded=true;render();return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){$("#sync").textContent="Bu cihazda kayıtlı";loaded=true;render();return}
    try{IS_OWNER=!!(await user.isOwner())}catch(e){IS_OWNER=false}
    const id=await user.id();
    docRef=db.collection("data/users/"+id).doc("defter");
    mode="db";
    let first=true;
    docRef.onSnapshot(snap=>{
      if(snap.exists){S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(JSON.stringify(snap.data())))}
      else if(first&&(S.weights.length||S.shots.length)){save()} // move local data into the account once
      first=false; loaded=true;
      if(!snap.metadata.hasPendingWrites) $("#sync").textContent="Hesabına kaydedildi";
      if(snap.exists&&lastSent&&JSON.stringify(snap.data())===lastSent) return; // echo of our own write
      const wait=holdUntil-Date.now();
      if(wait>0){setTimeout(()=>{if(!$("#sheetRoot").firstChild)render()},wait);return}
      if(!$("#sheetRoot").firstChild) render();
    },()=>{$("#sync").textContent="Bağlantı koptu, sayfayı yenile"});
  }catch(e){$("#sync").textContent="Bu cihazda kayıtlı";loaded=true;render()}
}

/* ---------- derived ---------- */
const startCut=()=>S.profile.startDate||(S.shots.length?sortedS0()[0].date:"");
const sortedS0=()=>[...S.shots].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
const sortedW=()=>[...S.weights].filter(x=>x.date>=startCut()).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
const sortedS=()=>[...S.shots].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
function weightAt(date){ // last weigh-in on or before date; else first within 3 days after
  const w=sortedW(); let best=null;
  for(const x of w){if(x.date<=date)best=x;else break}
  if(best)return best;
  const after=w.find(x=>x.date>date&&diffDays(date,x.date)<=3);
  return after||null;
}
function shotRows(){
  const s=sortedS(), w=sortedW(), latest=w[w.length-1];
  return s.map((x,i)=>{
    const a=weightAt(x.date);
    const nxt=s[i+1];
    const b=nxt?weightAt(nxt.date):latest;
    let loss=null;
    if(a&&b&&b!==a&&b.date>=a.date) loss=b.kg-a.kg;
    return {...x,n:i+1,from:a,to:b,loss,current:!nxt};
  });
}
function doseTable(){
  const rows=shotRows(); const m=new Map();
  for(const r of rows){const k=r.dose??"?";const o=m.get(k)||{dose:k,count:0,loss:0,has:false};o.count++;if(r.loss!=null){o.loss+=r.loss;o.has=true}m.set(k,o)}
  return [...m.values()].sort((a,b)=>(+a.dose||0)-(+b.dose||0));
}
function nextSite(){const s=sortedS();if(!s.length)return SITES[0];const i=SITES.indexOf(s[s.length-1].site);return SITES[(i+1)%SITES.length]}

/* ---------- views ---------- */
function render(){
  const ig=document.querySelector('.tab[data-tab="igne"]');
  if(ig){ig.hidden=!SHOTS();document.querySelector("nav.tabs .in").style.gridTemplateColumns=`repeat(${SHOTS()?5:4},1fr)`}
  if(!SHOTS()&&tab==="igne")tab="ozet";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===tab));
  $("#title").textContent={ozet:"Hafif",basari:"Başarıların",adim:"Adımlar",takviye:"Takviyeler",besin:"Protein & Su",kilo:"Kilo",igne:"İğneler",ayar:"Ayarlar"}[tab];
  $("#today").textContent=new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"});
  SCRUB=[];GID=0;
  $("#view").innerHTML=({ozet:vOzet,basari:vBasari,adim:vAdim,takviye:vTakviye,besin:()=>`<section>${todayCard()}</section>`,kilo:vKilo,igne:vIgne,ayar:vAyar})[tab]();
  if(ANIM){const sec=$("#view").querySelector("section");if(sec){sec.classList.add("enter");[...sec.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,8)))}}
  ANIM=false;
  bindView();
  if(!$("#mdefs").firstChild)$("#mdefs").innerHTML=medalDefs();
  const mt=$("#mtrack"),nn=mt&&mt.querySelector(".next");if(nn)mt.scrollLeft=nn.offsetLeft-mt.clientWidth/2+nn.clientWidth/2;
  if(tab==="ozet")setTimeout(checkCelebrate,450);
  maybeOnboard();
  if(loaded&&HP())syncHealth();
  if(loaded&&LN()&&!remT)remQueue();
  if(tab==="adim"&&HP()&&!HOURS)syncHealth(true);
}

function vOzet(){
  return vOzetMain();
}
function vOzetMain(){
  const w=sortedW(), s=sortedS(), P=S.profile;
  if(!w.length&&!s.length&&!SHOTS()){
    return `<section><div class="card empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 9a4 4 0 0 1 8 0M12 9l1.5-2"/></svg>
      <h2>Takibe başla</h2>
      <p class="muted" style="margin:0;max-width:34ch">Önce bugünkü kilonu gir. Tartıların, hedefine ilerlemen ve rozetlerin burada görünecek.</p>
      </div>
      ${actionsHtml()}
      ${suppMini()}
      ${stepCard()}
      ${remCta()}
      <button class="btn ghost" data-go="ayar">Hedefini ayarla</button></section>`;
  }
  if(!w.length){
    return `<section><div class="card empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--shot)" stroke-width="1.5"><path d="M14 4l6 6M17 7l-9 9-3 1 1-3 9-9M6 18l-3 3M11 8l2 2M8 11l2 2"/></svg>
      <h2>Takibe başla</h2>
      <p class="muted" style="margin:0;max-width:34ch">${s.length?"İğnen kaydedildi. Şimdi bugünkü kilonu gir; her iğne arasında kaç kilo verdiğini burada göreceksin.":"Önce bugünkü kilonu gir, sonra iğnelerini ekle. Her iğne arasında kaç kilo verdiğini burada göreceksin."}</p>
      </div>
      ${actionsHtml()}
      ${suppMini()}
      ${stepCard()}
      ${remCta()}
      ${s.length?`<div id="cycWrap" class="cycw" data-v="kadran">${cycleHtml("kadran")}</div>`:`<button class="btn ghost" data-go="ayar">Hedef ve ilaç bilgisini ayarla</button>`}</section>`;
  }
  const latest=w[w.length-1], first=w[0];
  const start=first?first.kg:P.startWeight;
  const lost=latest&&start!=null?latest.kg-start:null;
  const goal=P.goalWeight;
  let pct=null; if(goal!=null&&start!=null&&latest&&start>goal) pct=Math.max(0,Math.min(100,(start-latest.kg)/(start-goal)*100));
  const lastShot=s[s.length-1];
  const iv=P.intervalDays||7;
  let nextHtml=`<div class="next"><div class="pen">${penIcon()}</div><div><span class="eyebrow">Sıradaki iğne</span><b>Henüz iğne eklenmedi</b><span class="muted">İlk iğneni ekleyince takvim başlar.</span></div></div>`;
  if(lastShot){
    const nd=addDays(lastShot.date,iv), left=diffDays(today(),nd);
    const when=left>1?`${left} gün sonra`:left===1?"Yarın":left===0?"Bugün":`${-left} gün gecikti`;
    nextHtml=`<div class="next"><div class="pen">${penIcon()}</div><div style="min-width:0"><span class="eyebrow">Sıradaki iğne</span><b>${when}</b><span class="muted">${fmtD(nd)} ${shotTime(lastShot)} · ${esc(lastShot.dose??"")}${lastShot.dose?" mg · ":""}öneri: ${nextSite()}</span></div></div>`;
  }
  const days=first&&latest?Math.max(1,diffDays(first.date,latest.date)):null;
  const perWeek=days&&lost!=null?lost/days*7:null;
  const wk=latest?w.filter(x=>x.date>=addDays(latest.date,-7)):[];
  const last7=wk.length>1?wk[wk.length-1].kg-wk[0].kg:null;
  const rows=shotRows().filter(r=>r.loss!=null&&!r.current);
  const perShot=rows.length?rows.reduce((a,r)=>a+r.loss,0)/rows.length:null;
  const bmi=P.heightCm&&latest?latest.kg/((P.heightCm/100)**2):null;

/* ---------- tahmini ilaç düzeyi (tek kompartımanlı model, Bateman denklemi) ---------- */
const PK={half:5,tmax:1.5,F:0.9}; // yarı ömür 5 gün, zirve 1,5 gün; F: Tracky ile uyumlu ölçek
const KE=Math.log(2)/PK.half;
const KA=(()=>{let lo=KE*1.001,hi=50,m=1;for(let i=0;i<80;i++){m=(lo+hi)/2;const t=Math.log(m/KE)/(m-KE);if(t>PK.tmax)lo=m;else hi=m}return m})();
const shotTime=x=>x.time||"09:00";
const shotTs=x=>{const d=toD(x.date);const[h,mi]=shotTime(x).split(":").map(Number);d.setHours(h||0,mi||0,0,0);return d.getTime()};
const doseMg=x=>num(x.dose)??0;
const one=(dose,days)=>days<=0?0:PK.F*dose*KA/(KA-KE)*(Math.exp(-KE*days)-Math.exp(-KA*days));
const level=(ts,list)=>list.reduce((a,x)=>a+one(doseMg(x),(ts-shotTs(x))/864e5),0);
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const mg=n=>n.toLocaleString("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
const dm=t=>new Date(t).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
function pkState(){
  const now=Date.now(); const all=sortedS(); const past=all.filter(x=>shotTs(x)<=now);
  const last=past[past.length-1]; let next=null;
  if(last){const n={date:addDays(last.date,S.profile.intervalDays||7),time:shotTime(last),dose:last.dose};if(shotTs(n)>now)next=n}
  const upcoming=all.find(x=>shotTs(x)>now); if(upcoming)next=upcoming;
  return {now,past,last,next,fut:next?past.concat([next]):past};
}
function drugCard(){
  const P=pkState(); if(!P.last) return "";

function drugChart(P){
  const first=shotTs(sortedS()[0]);
  const t0=Math.max(first-864e5,P.now-21*864e5);
  const t1=P.next?shotTs(P.next)+4*864e5:P.now+5*864e5;
  const W=340,H=170,L=24,R=8,T=10,B=22, step=3*36e5;
  const past=[],fut=[];
  for(let t=t0;t<P.now;t+=step)past.push([t,level(t,P.past)]);
  const nowV=level(P.now,P.past); past.push([P.now,nowV]); fut.push([P.now,nowV]);
  for(let t=P.now+step;t<=t1;t+=step)fut.push([t,level(t,P.fut)]);
  const mx=Math.max(1,Math.ceil(Math.max(...past.map(p=>p[1]),...fut.map(p=>p[1]))+0.3));
  const x=t=>L+(W-L-R)*(t-t0)/(t1-t0), y=v=>T+(H-T-B)*(1-v/mx);
  const line=a=>a.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  let g="";for(let v=0;v<=mx;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v?'stroke-dasharray="2 4"':""}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif" font-weight="500">${v}</text>`;
  let lab="";for(let i=0;i<4;i++){const t=t0+(t1-t0)*i/3;lab+=`<text x="${x(t)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${i===0?"start":i===3?"end":"middle"}" font-family="Figtree, sans-serif" font-weight="500">${dm(t)}</text>`}
  const dots=P.past.filter(z=>shotTs(z)>=t0).map(z=>`<circle cx="${x(shotTs(z))}" cy="${y(level(shotTs(z),P.past))}" r="4" fill="var(--shot)"/>`).join("");
  const nd=P.next&&shotTs(P.next)<=t1?`<circle cx="${x(shotTs(P.next))}" cy="${y(level(shotTs(P.next),P.past))}" r="4" fill="var(--surface)" stroke="var(--shot)" stroke-width="2" stroke-dasharray="2 2"/>`:"";
  const area=line(past)+`L${x(P.now)} ${y(0)}L${x(past[0][0])} ${y(0)}Z`;
  const sid=SCRUB.push({W,H,L,R,T,B,color:"var(--shot)",pick:vx=>{
    const t=t0+(vx-L)/(W-L-R)*(t1-t0); const v=level(t,t<=P.now?P.past:P.fut);
    return {x:vx,y:y(v),title:mg(v)+" mg",sub:fmtDT(t)+(t>P.now+36e5?" · tahmin":"")};
  }})-1;
  return `<svg class="chart" data-sid="${sid}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tahmini ilaç düzeyi, mg">${g}
    <path class="${A("fade")}" d="${area}" fill="var(--shot)" opacity=".12"/>
    <path class="${A("draw")}" pathLength="1" d="${line(past)}" fill="none" stroke="var(--shot)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line(fut)}" fill="none" stroke="var(--shot)" stroke-width="2" stroke-dasharray="4 4" opacity=".8"/>
    ${dots}${nd}
    <circle cx="${x(P.now)}" cy="${y(nowV)}" r="4.5" fill="var(--surface)" stroke="var(--shot)" stroke-width="2.2"/>
    ${lab}</svg>`;
}
function chartDrugWeight(){

}

function phaseInfo(){

    <div class="stats">

      <div class="stat"><span class="eyebrow">Yağsız kg</span><div class="v">${sgn((b.kg-fm(b))-(a.kg-fm(a)))}</div></div>
    </div>

}

function addProtein(g,food){
  if(!(g>0&&g<=300)){toast("Protein miktarını gram olarak yaz");return}
  const r=ensureDay(today()), from=r.p, ts=Date.now(); r.p+=g; r.log.push([ts,"p",g,food||null]);
  holdUntil=Date.now()+1200; save();
  $("#plate").innerHTML=plateHtml(ts);
  countUp($("#pVal"),from,r.p); $("#pLeft").textContent=r.p>=pGoal()?"Hedef tamam":ml(pGoal()-r.p)+" g kaldı";
  const fl=document.createElement("span");fl.className="pfloat";fl.textContent="+"+g+" g";$("#plate").appendChild(fl);
  if(fl.animate)fl.animate([{transform:"translate(-50%,0)",opacity:0},{opacity:1,offset:.2},{transform:"translate(-50%,-34px)",opacity:0}],{duration:1100,easing:"ease-out"}).onfinish=()=>fl.remove();else fl.remove();
  refreshCommon();
  if(from<pGoal()&&r.p>=pGoal())toast("Protein hedefi tamam");
}
function addWater(){
  const r=ensureDay(today()), from=r.w, amt=wAmt, to=from+amt;
  r.w=to; r.log.push([Date.now(),"w",amt]); holdUntil=Date.now()+2200; save();
  const fin=()=>{refreshCommon();$("#wLog").innerHTML=wLogHtml();if(from<wGoal()&&to>=wGoal())toast("Su hedefi tamam")};
  countUp($("#wVal"),from,to,650+amt*2.2);
  $("#wBar").style.width=Math.min(100,to/wGoal()*100)+"%";$("#wGoalTxt").textContent=wGoalTxt(to);
  const btn=$("#wAdd");if(btn&&btn.animate)btn.animate([{transform:"scale(.96)"},{transform:"none"}],{duration:220});
  if(GLASS)GLASS.pour(amt,to/wGoal(),fin);else fin();
}
function undoLast(){
  const r=ensureDay(today()); const last=r.log.pop(); if(!last)return;
  if(last[1]==="p")r.p=Math.max(0,r.p-last[2]); else r.w=Math.max(0,r.w-last[2]);
  save(); render(); toast("Geri alındı");
}
function setWAmt(v){
  wAmt=v; try{localStorage.setItem("hf-wamt",v)}catch(e){}
  const lb=$("#wAmtLbl"); lb.textContent=v; if(lb.animate)lb.animate([{transform:"translateY(-3px)",opacity:.4},{transform:"none",opacity:1}],{duration:180,easing:"ease-out"});
  document.querySelectorAll("[data-wamt]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.wamt===v));
}
function bindToday(){
  const c=$("#todayCard"); if(!c)return;
  c.querySelectorAll("[data-padd]").forEach(b=>b.addEventListener("click",()=>addProtein(+b.dataset.padd)));
  c.querySelectorAll("[data-food]").forEach(b=>b.addEventListener("click",()=>{const f=FOODS.find(x=>x.k===b.dataset.food);
    if(f.pick){const pk=$("#barPick");pk.hidden=!pk.hidden;if(!pk.hidden&&pk.animate)pk.animate([{opacity:0,transform:"translateY(-6px)"},{opacity:1,transform:"none"}],{duration:200,easing:"ease-out"});return}
    addProtein(f.g,f.k)}));
  const setBar=v=>{barG=v;try{localStorage.setItem("hf-barg",v)}catch(e){}$("#barG").textContent=v;$("#barG2").textContent=v;const r=$("#barRange");r.value=v;r.style.setProperty("--p",(v-10)/11*100+"%")};
  $("#barRange").addEventListener("input",e=>setBar(+e.target.value));
  $("#barCancel").addEventListener("click",()=>{$("#barPick").hidden=true});
  $("#barAdd").addEventListener("click",()=>{addProtein(barG,"bar");$("#barPick").hidden=true});
  c.querySelector("[data-pcustom]").addEventListener("click",()=>{const f=$("#pForm");f.hidden=!f.hidden;if(!f.hidden)$("#p-in").focus()});
  $("#pForm").addEventListener("submit",e=>{e.preventDefault();const v=num($("#p-in").value);addProtein(v==null?0:Math.round(v));$("#p-in").value="";$("#pForm").hidden=true});
  c.querySelectorAll("[data-wamt]").forEach(b=>b.addEventListener("click",()=>{setWAmt(+b.dataset.wamt);addWater();if(b.animate)b.animate([{transform:"scale(.92)"},{transform:"none"}],{duration:260,easing:"cubic-bezier(.3,1.6,.5,1)"})}));
  c.querySelectorAll("[data-wstep]").forEach(b=>b.addEventListener("click",()=>setWAmt(Math.max(50,Math.min(1000,wAmt+ +b.dataset.wstep)))));
  $("#wAdd").addEventListener("click",addWater);
  $("#undo").addEventListener("click",undoLast);
  GLASS=makeGlass($("#glassCv"),dayRec(today()).w/wGoal());
}

function trendInfo(){
  const w=sortedW(); if(w.length<2) return null;
  const ma=w.map(p=>{const from=addDays(p.date,-6);const win=w.filter(q=>q.date>=from&&q.date<=p.date);return {date:p.date,kg:win.reduce((a,b)=>a+b.kg,0)/win.length}});
  const last=ma[ma.length-1], rec=ma.filter(p=>p.date>=addDays(last.date,-14)), f=rec[0];
  return {cur:last.kg,slope:(last.kg-f.kg)/Math.max(1,diffDays(f.date,last.date)),date:last.date};
}
function milestones(){
  const w=sortedW(); if(w.length<2) return null;
  const start=w[0].kg, goal=S.profile.goalWeight, floor=goal??start*0.75, L=[];
  for(let k=Math.floor((start-0.01)/5)*5;k>floor+0.01;k-=5)L.push({id:"kg"+k,kg:k,t:`${k}`,u:"kg",s:`${k} kg`});
  [5,10,15,20,25].forEach(p=>{const k=Math.round(start*(1-p/100)*10)/10;if(k>=floor-0.01)L.push({id:"p"+p,kg:k,t:`%${p}`,u:"",s:`vücut ağırlığı · ${kg(k)} kg`})});
  if(goal!=null)L.push({id:"goal",kg:goal,t:"Hedef",u:"",s:`${kg(goal)} kg`,goal:true});
  L.sort((a,b)=>b.kg-a.kg);
  const T=trendInfo();
  for(const m of L){const hit=w.find(x=>x.kg<=m.kg+1e-9);m.done=hit?hit.date:null;
    if(!m.done&&T&&T.slope<-0.01)m.eta=addDays(T.date,Math.ceil((T.cur-m.kg)/-T.slope))}
  return {L,start,cur:w[w.length-1].kg};
}

function checkCelebrate(){

  try{localStorage.setItem("hf-cel",JSON.stringify([...new Set([...seen,...done.map(x=>x.id)])]))}catch(_){}

let chartMode=(()=>{try{return localStorage.getItem("dd-chart")||"egri"}catch(e){return "egri"}})();
const MODES=[["egri","Eğri"],["igne","İğne"],["hafta","Haftalık"],["trend","Trend"],["ilac","İlaç"],["yag","Yağ"]];
function chartCard(){

function weekly(){
  const m=new Map();
  for(const x of sortedW()){const d=toD(x.date);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);const k=d.toISOString().slice(0,10);const o=m.get(k)||{k,sum:0,n:0,mon:d};o.sum+=x.kg;o.n++;m.set(k,o)}
  const arr=[...m.values()].sort((a,b)=>a.mon-b.mon).map(o=>({mon:o.mon,avg:o.sum/o.n}));
  const out=[];for(let i=1;i<arr.length;i++)out.push({label:arr[i].mon.toLocaleDateString("tr-TR",{day:"numeric",month:"short"}),v:arr[i].avg-arr[i-1].avg,live:i===arr.length-1});
  return out;
}
function chartBars(items){
  if(!items.length)return `<p class="muted" style="margin:0">Bu görünüm için en az iki iğne ya da iki hafta veri gerekiyor.</p>`;
  const W=340,H=190,L=8,R=8,T=22,B=26;
  const mx=Math.max(1,...items.map(i=>Math.abs(i.v)));
  const hasUp=items.some(i=>i.v>0);
  const zero=hasUp?T+(H-T-B)*0.3:T;
  const scale=(H-B-zero)/mx;
  const bw=(W-L-R)/items.length;
  const gid="g"+(++GID);
  const bars=items.map((it,i)=>{
    const x=L+i*bw+bw*0.2, w=bw*0.6, h=Math.abs(it.v)*scale;
    const y=it.v<0?zero:zero-h;
    const ly=it.v<0?zero-7:zero+15;
    return `<rect class="${A("gb"+(it.v>0?" gbp":""))}" style="animation-delay:${i*60}ms" x="${x}" y="${y}" width="${w}" height="${Math.max(2,h)}" rx="${Math.min(8,w/2)}" fill="${it.v<=0?`url(#${gid})`:"var(--bad)"}" opacity="${it.live?.42:1}"/>
      <text class="${A("fade")}" x="${x+w/2}" y="${Math.min(ly,H-B-2)}" text-anchor="middle" font-size="11" font-weight="700" font-family="Figtree, sans-serif" fill="${it.v<=0?"var(--emerald-2)":"var(--bad)"}">${sgn(it.v)}</text>
      <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif">${it.label}</text>`}).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dönemlere göre kilo değişimi"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E9C7D"/><stop offset="1" stop-color="#8FDDC4"/></linearGradient></defs><line x1="${L}" x2="${W-R}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1.5"/>${bars}</svg>`;
}
function chartTrend(){
  const w=sortedW(); const W=340,H=190,L=34,R=8,T=12,B=24;
  const ma=w.map(p=>{const from=addDays(p.date,-6);const win=w.filter(q=>q.date>=from&&q.date<=p.date);return {date:p.date,kg:win.reduce((a,b)=>a+b.kg,0)/win.length}});
  const last=ma[ma.length-1]; const from14=addDays(last.date,-14);
  const recent=ma.filter(p=>p.date>=from14); const first=recent[0];
  const days=Math.max(1,diffDays(first.date,last.date)); const slope=(last.kg-first.kg)/days;
  const endDate=addDays(last.date,28); const proj=last.kg+slope*28;
  const d0=w[0].date, span=diffDays(d0,endDate);
  let lo=Math.min(...w.map(x=>x.kg),proj), hi=Math.max(...w.map(x=>x.kg));
  const goal=S.profile.goalWeight; if(goal!=null&&goal>lo-4)lo=Math.min(lo,goal);
  lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);
  const x=d=>L+(W-L-R)*diffDays(d0,d)/span, y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  let g="";for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif" font-weight="500">${v}</text>`;
  if(goal!=null&&goal>=lo&&goal<=hi)g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-dasharray="2 3"/><text x="${L+4}" y="${y(goal)-4}" font-size="10" fill="var(--good)">hedef</text>`;
  const dots=w.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="2.6" fill="var(--muted)" opacity=".55"/>`).join("");
  const line=ma.map((p,i)=>(i?"L":"M")+x(p.date).toFixed(1)+" "+y(p.kg).toFixed(1)).join("");
  let goalTxt="";
  if(goal!=null&&slope<0&&last.kg>goal){const dd=Math.ceil((last.kg-goal)/-slope);goalTxt=`<text x="${W-R}" y="${T+10}" text-anchor="end" font-size="10" fill="var(--muted)">bu hızla hedef: ${fmtShort(addDays(last.date,dd))}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo trendi ve tahmin">${g}${dots}
    <path class="${A("draw")}" pathLength="1" d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${x(last.date)}" y1="${y(last.kg)}" x2="${x(endDate)}" y2="${y(proj)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>
    <circle cx="${x(endDate)}" cy="${y(proj)}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="${x(endDate)-4}" y="${y(proj)+16}" text-anchor="end" font-size="10" font-family="Figtree, sans-serif" font-weight="500" fill="var(--accent)">~${kg(proj)}</text>
    ${goalTxt}
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtShort(d0)}</text>
    <text x="${W-R}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtShort(endDate)}</text></svg>
    <p class="muted" style="margin:0;font-size:13px">Son 14 günün hızı: haftada ${sgn(slope*7)} kg. Tahmin sadece bir yön göstergesidir.</p>`;
}
function chart(){
  const w=sortedW(), s=sortedS();
  const W=340,H=180,L=34,R=8,T=12,B=24;
  const d0=w[0].date, d1=[w[w.length-1].date,s.length?s[s.length-1].date:d0].sort().pop();
  const span=Math.max(1,diffDays(d0,d1));
  let lo=Math.min(...w.map(x=>x.kg)), hi=Math.max(...w.map(x=>x.kg));
  if(S.profile.goalWeight!=null&&S.profile.goalWeight>lo-3) lo=Math.min(lo,S.profile.goalWeight);
  lo=Math.floor(lo-0.5); hi=Math.ceil(hi+0.5); if(hi-lo<2)hi=lo+2;
  const x=d=>L+(W-L-R)*diffDays(d0,d)/span, y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  const step=Math.max(1,Math.ceil((hi-lo)/4));
  let g=""; for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Figtree, sans-serif" font-weight="500">${v}</text>`}
  const goal=S.profile.goalWeight;
  if(goal!=null&&goal>=lo&&goal<=hi) g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-dasharray="2 3"/><text x="${W-R}" y="${y(goal)-4}" text-anchor="end" font-size="10" fill="var(--good)">hedef</text>`;
  const shots=s.filter(z=>z.date>=d0).map(z=>`<line x1="${x(z.date)}" x2="${x(z.date)}" y1="${T+6}" y2="${H-B}" stroke="var(--shot)" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/><circle cx="${x(z.date)}" cy="${T+3}" r="3.2" fill="var(--shot)"/>`).join("");
  const gid="g"+(++GID);
  const pts=w.map(p=>[x(p.date),y(p.kg)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const area=path+`L${pts[pts.length-1][0]} ${H-B}L${pts[0][0]} ${H-B}Z`;
  const last=pts[pts.length-1];
  const sid=SCRUB.push({W,H,L,R,T,B,pick:vx=>{
    let best=null,bd=1e9; w.forEach((p,i)=>{const d=Math.abs(x(p.date)-vx);if(d<bd){bd=d;best=i}});
    const p=w[best], pr=w[best-1];
    return {x:x(p.date),y:y(p.kg),title:kg(p.kg)+" kg",sub:fmtD(p.date)+(pr?" · "+sgn(p.kg-pr.kg):"")};
  }})-1;
  return `<svg class="chart" data-sid="${sid}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zaman içinde kilo">
    ${g}${shots}
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.24"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    <path class="${A("fade")}" d="${area}" fill="url(#${gid})"/>
    <path class="${A("draw")}" pathLength="1" d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="${A("pop2")}" cx="${last[0]}" cy="${last[1]}" r="9" fill="var(--accent)" opacity=".16"/>
    <circle class="${A("pop2")}" cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtShort(d0)}</text>
    <text x="${W-R}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtShort(d1)}</text>
  </svg>`;
}

let hcBusy=false,hcLast=0;
async function syncHealth(force){
  const H=HP(); if(!H||!(S.hc&&S.hc.on)||hcBusy) return; if(!force&&Date.now()-hcLast<60000) return;
  hcBusy=true; hcLast=Date.now(); let changed=false;
  const iso=d=>toD(d).toISOString();
  try{
    const r=await H.queryAggregated({dataType:"steps",startDate:iso(addDays(today(),-29)),endDate:new Date().toISOString(),bucket:"day",aggregation:"sum"});
    S.steps=S.steps||{}; for(const b of (r&&r.samples)||[]){const d=ymd(new Date(b.startDate).getTime()+36e5*12);const v=Math.round(b.value||0);if(S.steps[d]!==v){S.steps[d]=v;changed=true}}
    for(const d of Object.keys(S.steps))if(d<addDays(today(),-90))delete S.steps[d];
  }catch(_){}
  try{
    const r=await H.queryAggregated({dataType:"steps",startDate:iso(today()),endDate:new Date().toISOString(),bucket:"hour",aggregation:"sum"});
    const h=Array(24).fill(0); for(const b of (r&&r.samples)||[])h[new Date(b.startDate).getHours()]+=Math.round(b.value||0); HOURS=h;
  }catch(_){}
  try{
    const from=S.hc.wFrom||addDays(today(),-30);
    const [wr,fr]=await Promise.all([H.readSamples({dataType:"weight",startDate:iso(from),endDate:new Date().toISOString(),limit:500,ascending:true}).catch(()=>null),H.readSamples({dataType:"bodyFat",startDate:iso(from),endDate:new Date().toISOString(),limit:500,ascending:true}).catch(()=>null)]);
    const seen=new Set(S.weights.map(x=>x.hcId).filter(Boolean));
    for(const x of (wr&&wr.samples)||[]){const id=x.platformId||(x.startDate+x.value);if(seen.has(id))continue;seen.add(id);
      const d=ymd(new Date(x.startDate).getTime()),k=Math.round(x.value*100)/100; if(!(k>=20&&k<=400))continue;
      if(S.weights.some(w=>w.date===d&&Math.abs(w.kg-k)<0.15))continue;
      S.weights.push({id:uid(),date:d,kg:k,fat:null,note:null,src:"hc",hcId:id,t:new Date(x.startDate).getTime()});if(S.profile.startWeight==null)S.profile.startWeight=k;changed=true}
    for(const x of (fr&&fr.samples)||[]){const d=ymd(new Date(x.startDate).getTime()),f=Math.round(x.value*10)/10; if(!(f>=3&&f<=70))continue;
      const w=S.weights.filter(w=>w.date===d&&w.fat==null).sort((a,b)=>Math.abs((a.t||0)-new Date(x.startDate).getTime())-Math.abs((b.t||0)-new Date(x.startDate).getTime()))[0];
      if(w){w.fat=f;changed=true}}
    S.hc.wFrom=today();
  }catch(_){}
  S.hc.last=Date.now(); hcBusy=false; save();
  if(changed||tab==="adim"){if(!$("#sheetRoot").firstChild&&!$("#onb")&&(tab==="ozet"||tab==="adim"||tab==="kilo"))render()}
}

      if(ew){Object.assign(ew,{date:$("#w-date").value||ew.date,kg:v,fat:fv,note:$("#w-note").value.trim()||null});save();closeSheet();toast("Tartı güncellendi");return}
      S.weights.push({id:uid(),date:$("#w-date").value||today(),kg:v,fat:fv,note:$("#w-note").value.trim()||null,t:Date.now()});
      if(S.profile.startWeight==null&&S.weights.length===1)S.profile.startWeight=v;
      save(); closeSheet(); toast("Kilo kaydedildi");
    });
  } else {
    let site=ssite;
    $("#sites").addEventListener("click",e=>{const b=e.target.closest(".site");if(!b)return;site=b.dataset.site;$("#sites").querySelectorAll(".site").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $("#fS").addEventListener("submit",e=>{e.preventDefault();
      const date=$("#s-date").value||today(); const dose=num($("#s-dose").value);
      if(es){Object.assign(es,{date,time:$("#s-time").value||"09:00",dose:dose==null?null:dose.toLocaleString("tr-TR"),site,note:$("#s-note").value.trim()||null});save();closeSheet();toast("İğne güncellendi");return}
      S.shots.push({id:uid(),date,time:$("#s-time").value||"09:00",dose:dose==null?null:dose.toLocaleString("tr-TR"),site,note:$("#s-note").value.trim()||null});
      const k=num($("#s-kg").value);
      if(k!=null&&k>=20&&k<=400){S.weights.push({id:uid(),date,kg:k,note:"iğne günü",t:Date.now()});if(S.profile.startWeight==null)S.profile.startWeight=k}
      save(); closeSheet(); toast("İğne kaydedildi");
    });
  }
}
function closeSheet(){$("#sheetRoot").innerHTML="";render()}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

function bindView(){
  const v=$("#view");
  v.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.open)));
  v.querySelectorAll("[data-edit-w]").forEach(b=>b.addEventListener("click",()=>openSheet("weight",b.dataset.editW)));
  v.querySelectorAll("[data-edit-shot]").forEach(b=>b.addEventListener("click",()=>openSheet("shot",b.dataset.editShot)));
  v.querySelectorAll("svg[data-sid]").forEach(bindScrub);
  bindToday();
  v.querySelectorAll("[data-chart]").forEach(b=>b.addEventListener("click",()=>{chartMode=b.dataset.chart;ANIM=true;try{localStorage.setItem("dd-chart",chartMode)}catch(e){}render()}));
  v.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{selPhase=null;ANIM=true;tab=b.dataset.go;render();window.scrollTo(0,0)}));
  v.querySelectorAll("[data-del-w],[data-del-shot]").forEach(b=>b.addEventListener("click",()=>{
    if(!b.classList.contains("armed")){const h=b.innerHTML;b.classList.add("armed");b.textContent="Sil?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.innerHTML=h}},3000);return}
    if(b.dataset.delW)S.weights=S.weights.filter(x=>x.id!==b.dataset.delW);
    else S.shots=S.shots.filter(x=>x.id!==b.dataset.delShot);
    save();render();toast("Silindi");
  }));
  bindData();
  bindSupp();
  const f=$("#fAyar");
  if(f)$("#a-shots").addEventListener("change",e=>{$("#a-shotf").hidden=!e.target.checked});
  bindRem();
  if($("#a-hc"))$("#a-hc").addEventListener("click",()=>{if(S.hc&&S.hc.on){try{HP().openHealthConnectSettings()}catch(_){}}else openHealthSheet()});
  v.querySelectorAll("[data-hc]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openHealthSheet()}));
  if(f)f.addEventListener("submit",e=>{e.preventDefault();
    S.profile={usesShots:$("#a-shots").checked,onboarded:true,age:(n=>n&&n>=10&&n<=110?Math.round(n):null)(num($("#a-age").value)),sex:$("#a-sex").value||null,celebrated:S.profile.celebrated,noCelebrate:!$("#a-cel").checked,trackyImported:!!S.profile.trackyImported,zeppImported:!!S.profile.zeppImported,drug:$("#a-drug").value.trim()||null,startWeight:num($("#a-start").value),goalWeight:num($("#a-goal").value),heightCm:num($("#a-height").value),proteinGoal:(n=>n&&n>0?Math.round(n):null)(num($("#a-prot").value)),waterGoal:(n=>n&&n>0?Math.round(n):null)(num($("#a-water").value)),startDate:S.profile.startDate||null,stepGoal:$("#a-step")?(n=>n&&n>=500?Math.round(n):null)(num($("#a-step").value)):(S.profile.stepGoal??null),intervalDays:Math.max(1,Math.round(num($("#a-iv").value)||7))};
    save();toast("Ayarlar kaydedildi");tab="ozet";render();
  });
}
function setHero(v,dir){heroV=v;try{localStorage.setItem("hf-hero",heroV)}catch(_){}
  const hw=$("#heroWrap");if(!hw||!HERO_CTX)return;hw.innerHTML=heroHtml(HERO_CTX);const cd=hw.firstElementChild;
  if(cd&&cd.animate&&!matchMedia("(prefers-reduced-motion: reduce)").matches)cd.animate([{opacity:.2,transform:`translateX(${dir?dir*40:0}px) scale(.985)`},{opacity:1,transform:"none"}],{duration:300,easing:"cubic-bezier(.2,.8,.2,1)"});}
let yX=null,yY=null;
$("#view").addEventListener("touchstart",e=>{if(!e.target.closest("#cycWrap")||e.target.closest("[data-cyc],[data-ph],svg[data-sid]")){yX=null;return}yX=e.touches[0].clientX;yY=e.touches[0].clientY},{passive:true});
$("#view").addEventListener("touchend",e=>{if(yX==null)return;const dx=e.changedTouches[0].clientX-yX,dy=e.changedTouches[0].clientY-yY;yX=null;
  if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.3)return;const i=CYCS.findIndex(c=>c[0]===cycV),n=CYCS.length,d=dx<0?1:-1;setCyc(CYCS[(i+d+n)%n][0],d)},{passive:true});
let cX=null,cY=null;
$("#view").addEventListener("touchstart",e=>{if(!e.target.closest("#compWrap")||e.target.closest("[data-comp]")){cX=null;return}cX=e.touches[0].clientX;cY=e.touches[0].clientY},{passive:true});
$("#view").addEventListener("touchend",e=>{if(cX==null)return;const dx=e.changedTouches[0].clientX-cX,dy=e.changedTouches[0].clientY-cY;cX=null;
  if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.3)return;const i=COMPS.findIndex(c=>c[0]===compV),n=COMPS.length,d=dx<0?1:-1;setComp(COMPS[(i+d+n)%n][0],d)},{passive:true});
let swX=null,swY=null;
$("#view").addEventListener("touchstart",e=>{if(!e.target.closest("#heroWrap")||e.target.closest("[data-hero]")){swX=null;return}swX=e.touches[0].clientX;swY=e.touches[0].clientY},{passive:true});
$("#view").addEventListener("touchend",e=>{if(swX==null)return;const dx=e.changedTouches[0].clientX-swX,dy=e.changedTouches[0].clientY-swY;swX=null;
  if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.3)return;const i=HEROS.findIndex(h=>h[0]===heroV),n=HEROS.length,d=dx<0?1:-1;setHero(HEROS[(i+d+n)%n][0],d)},{passive:true});
let msX=null;
$("#view").addEventListener("mousedown",e=>{msX=e.target.closest("#heroWrap")&&!e.target.closest("[data-hero]")?e.clientX:null});
$("#view").addEventListener("mouseup",e=>{if(msX==null)return;const dx=e.clientX-msX;msX=null;if(Math.abs(dx)<60)return;const i=HEROS.findIndex(h=>h[0]===heroV),n=HEROS.length,d=dx<0?1:-1;setHero(HEROS[(i+d+n)%n][0],d)});
$("#view").addEventListener("click",e=>{const cp=e.target.closest("[data-cph]");if(cp){selPhase=+cp.dataset.cph;const w=cp.closest(".cycw");if(w){w.innerHTML=cycleHtml(w.dataset.v);const d=$("#phd");if(d&&d.animate)d.animate([{opacity:.3,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:240,easing:"ease-out"})}return}const cy=e.target.closest("[data-cyc]");if(cy){const i0=CYCS.findIndex(c=>c[0]===cycV),i1=CYCS.findIndex(c=>c[0]===cy.dataset.cyc);setCyc(cy.dataset.cyc,i1>i0?1:-1);return}const cb=e.target.closest("[data-comp]");if(cb){const i0=COMPS.findIndex(c=>c[0]===compV),i1=COMPS.findIndex(c=>c[0]===cb.dataset.comp);setComp(cb.dataset.comp,i1>i0?1:-1);return}if(e.target.closest("[data-share]")){openShare();return}const h=e.target.closest("[data-hero]");if(h&&HERO_CTX){heroV=h.dataset.hero;try{localStorage.setItem("hf-hero",heroV)}catch(_){}
  const hw=$("#heroWrap");hw.innerHTML=heroHtml(HERO_CTX);const cd=hw.firstElementChild;if(cd&&cd.animate)cd.animate([{opacity:.4,transform:"scale(.985)"},{opacity:1,transform:"none"}],{duration:260,easing:"ease-out"});return}
  const b=e.target.closest("[data-ph]");if(!b)return;const w=$("#phaseWrap");if(!w)return;
  const d=$("#phAll");phAllOpen=!!(d&&d.open);selPhase=+b.dataset.ph;w.innerHTML=phaseInner();
  const ph=w.querySelector(".phase");if(ph&&ph.animate)ph.animate([{opacity:.3,transform:"translateY(4px)"},{opacity:1,transform:"none"}],{duration:220,easing:"ease-out"});
  $("#phAll")?.addEventListener("toggle",ev=>{phAllOpen=ev.target.open});});
$("#gearBtn").addEventListener("click",()=>{selPhase=null;ANIM=true;tab="ayar";render();window.scrollTo(0,0)});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{selPhase=null;ANIM=true;tab=t.dataset.tab;render();window.scrollTo(0,0)}));
boot();
/* Android geri tuşu: önce kutlamayı, sonra açık alt sayfayı kapatır, sonra Özet'e döner, en son uygulamadan çıkar */
if(CAP&&CAP.App)window.Capacitor.addListener("App","backButton",()=>{
  const c=$("#celeb");if(c){c.remove();return}
  if($("#onb")){if(OB&&OB.step>1)obBack();else CAP.App.exitApp();return}
  if($("#sheetRoot").firstChild){closeSheet();return}
  if(tab!=="ozet"){selPhase=null;tab="ozet";render();window.scrollTo(0,0);return}
  CAP.App.exitApp();
});
})();
</script>
